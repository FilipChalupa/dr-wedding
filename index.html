<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dr. Wedding</title>
<meta name="description" content="Dr. Wedding — retro svatební duel pro dva (klon Dr. Mario).">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#241a11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dr. Wedding">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    height:100%; width:100%;
    background:#06060a;
    background:radial-gradient(circle at 50% 35%, #15151f 0%, #08080c 60%, #000 100%);
    overflow:hidden;
    font-family:'Courier New',monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#cdc8dd; user-select:none; -webkit-user-select:none;
  }

  /* ---- the TV cabinet ---- */
  .tv {
    position:relative;
    padding:2.6vh 3.4vh 3.2vh 3.4vh;
    border-radius:2.2vh;
    background:linear-gradient(160deg,#5a4632 0%,#3a2c1d 35%,#241a11 100%);
    box-shadow:
      inset 0 0 2px rgba(255,220,180,.25),
      inset 0 6px 14px rgba(0,0,0,.55),
      0 14px 40px rgba(0,0,0,.8),
      0 2px 0 rgba(255,255,255,.05);
    border:2px solid #1a120a;
    display:flex; flex-direction:column; align-items:center; gap:3.2vh;
    max-height:100vh;
  }
  .tv::before { /* speaker / detail strip */
    content:""; position:absolute; right:3.4vh; bottom:1.6vh;
    width:4.4vh; height:2.2vh; border-radius:3px;
    background:repeating-linear-gradient(90deg,#1a120a 0 2px,#3a2c1d 2px 4px);
    box-shadow:inset 0 0 3px #000;
  }
  .led {
    position:absolute; left:3.6vh; bottom:2.3vh;
    width:1vh; height:1vh; border-radius:50%;
    background:#ff5d5d; box-shadow:0 0 6px 2px rgba(255,80,80,.8);
    animation:pulse 2.4s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }

  /* ---- the screen ---- */
  .screen {
    position:relative;
    width:min(86vw, 112vh);
    aspect-ratio:4/3;
    background:#000;
    border-radius:6% / 8%;
    overflow:hidden;
    box-shadow:
      inset 0 0 7vh rgba(0,0,0,.95),
      inset 0 0 1.5vh rgba(0,0,0,1),
      0 0 0 1.2vh #0c0c0c,
      0 0 0 1.6vh #2a2a2a;
  }
  canvas {
    position:absolute; inset:0;
    width:100%; height:100%;
    image-rendering:pixelated; image-rendering:crisp-edges;
    /* gentle CRT bulge */
    transform:scale(1.012);
  }
  .scanlines {
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px,
      rgba(0,0,0,.22) 2px, rgba(0,0,0,.22) 3px);
    mix-blend-mode:multiply;
  }
  .glow {
    position:absolute; inset:0; pointer-events:none; z-index:6;
    background:
      radial-gradient(circle at 50% 42%, rgba(120,160,255,.06), transparent 60%),
      radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  .flicker {
    position:absolute; inset:0; pointer-events:none; z-index:7;
    background:rgba(180,200,255,.025);
    animation:flick .12s steps(2) infinite;
  }
  @keyframes flick { 0%{opacity:.5} 50%{opacity:.9} 100%{opacity:.4} }

  /* zapínací efekt CRT: černo → tenká jasná linka → svislé roztažení + záblesk → obraz */
  .crton {
    position:absolute; inset:0; pointer-events:none; z-index:10;
    background:#04040a; overflow:hidden;
    animation:crtBlack .9s ease-out forwards;
  }
  .crton-beam {
    position:absolute; left:0; right:0; top:0; height:100%;
    background:linear-gradient(#bfe8ff,#ffffff 45%,#bfe8ff);
    transform:scaleY(.012); transform-origin:center;
    box-shadow:0 0 2vh rgba(200,235,255,.9);
    animation:crtBeam .9s ease-out forwards;
  }
  @keyframes crtBlack { 0%,55%{opacity:1} 100%{opacity:0} }
  @keyframes crtBeam {
    0%,20%   { transform:scaleY(.012); opacity:1; }
    45%      { transform:scaleY(1);    opacity:1; }   /* roztažení + záblesk */
    62%      { transform:scaleY(1);    opacity:.85; }
    100%     { transform:scaleY(1);    opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ .crton, .crton-beam { animation:none; opacity:0; } }

  /* easter egg „vzhůru nohama": otoč obraz (jen plochu, ne skříň s tlačítky) o 180° */
  body.flip180 .screen { transform:rotate(180deg); }

  /* tlačítka přímo na hnědé skříni televize (jen ikonky, kompaktní) */
  .controls {
    display:flex; gap:1.2vh; z-index:20;
  }
  .controls button {
    display:inline-flex; align-items:center; justify-content:center;
    font-family:inherit; font-size:1.9vh; font-weight:bold; line-height:1;
    padding:.5vh .9vh; min-width:3.6vh; border-radius:.7vh; cursor:pointer;
    color:#e7c98c; border:1px solid #120c06;
    background:linear-gradient(#4a3826,#2a1e13);
    box-shadow:inset 0 1px 0 rgba(255,220,180,.18), 0 1px 0 #120c06;
    text-shadow:0 1px 0 #000;
  }
  .controls button:active { transform:translateY(1px); box-shadow:inset 0 1px 2px #000; }
  .controls button.muted { opacity:.5; text-decoration:line-through; }   /* zvuk vypnutý */
  .controls button[hidden] { display:none; }   /* jinak by display:inline-flex přebil atribut hidden */

  :fullscreen.tv, :-webkit-full-screen.tv {
    width:100vw; height:100vh; border-radius:0;
    display:flex; align-items:center; justify-content:center;
    /* přebytečnou plochu (jiný poměr stran) vyplň modrým pozadím hry, ne černou */
    padding:0; background:linear-gradient(#1a2140,#0a0d1c);
    cursor:none;   /* ve fullscreenu skryj kurzor */
  }
  :fullscreen.tv *, :-webkit-full-screen.tv * { cursor:none; }
  :fullscreen.tv .screen, :-webkit-full-screen.tv .screen {
    width:min(100vw,133.333vh); height:auto;
    border-radius:0; box-shadow:none;   /* bez tmavého okraje → modrá plynule navazuje na pruhy */
  }
  /* bez tmavé viněty na okraji, ať se plocha nerozchází s okolními pruhy (jen jemná modrá záře) */
  :fullscreen.tv .glow, :-webkit-full-screen.tv .glow, body.tvmode .glow {
    background:radial-gradient(circle at 50% 42%, rgba(120,160,255,.06), transparent 60%);
  }
  :fullscreen.tv .controls, :fullscreen.tv .led, :fullscreen.tv::before { display:none; }
  :-webkit-full-screen.tv .controls, :-webkit-full-screen.tv .led, :-webkit-full-screen.tv::before { display:none; }

  /* ---- ?tv : kiosk režim pro fyzickou televizi (skryje skříň + tlačítka) ---- */
  /* přebytečnou plochu (jiný poměr stran) vyplň modrým pozadím hry, ne černou */
  body.tvmode { background:linear-gradient(#1a2140,#0a0d1c); cursor:none; }
  body.tvmode * { cursor:none; }
  body.tvmode .controls { display:none; }
  body.tvmode .tv {
    width:100vw; height:100vh; padding:0; border:0; border-radius:0;
    background:linear-gradient(#1a2140,#0a0d1c); box-shadow:none;
    display:flex; align-items:center; justify-content:center;
  }
  body.tvmode .tv::before, body.tvmode .led { display:none; }
  /* --tv-safe = jaká část rámu je na televizi doopravdy vidět (0.92 = 92 %).
     CRT kvůli overscanu ukusuje ~5–10 % na každé straně, takže obraz zmenšíme
     do bezpečné zóny — jinak se ořízne titulek. Ladí se z URL: ?tv&safe=90 */
  body.tvmode .screen {
    width:min(calc(100vw * var(--tv-safe,0.92)), calc(133.333vh * var(--tv-safe,0.92)));
    height:auto;
    border-radius:0;
    box-shadow:none;   /* bez tmavého okraje → modrá plynule navazuje na pruhy */
  }

  /* ==== Overlay statistik (sdílí vzhled se stats.html, ovládá se gamepadem) ==== */
  #statsOverlay {
    position:fixed; inset:0; z-index:60; display:none; overflow-y:auto; overflow-x:hidden;
    background:radial-gradient(circle at 50% 35%, #15151f 0%, #08080c 60%, #000 100%);
    font-family:'Courier New',monospace; color:#cdc8dd; -webkit-text-size-adjust:100%;
  }
  #statsOverlay.open { display:block; }
  #statsOverlay .stats { width:min(96vw,860px); margin:0 auto; padding:4vh 2vh 2vh; }
  #statsOverlay h1 { color:#f8d77e; font-size:clamp(20px,3.4vh,34px); letter-spacing:.25vh;
    text-align:center; font-style:italic; text-shadow:0 2px 0 #000; }
  #statsOverlay h1 small { display:block; font-style:normal; font-size:clamp(10px,1.5vh,14px); letter-spacing:.4vh;
    color:#cba6ec; margin-top:.6vh; }
  #statsOverlay .nav { display:flex; align-items:center; justify-content:center; gap:1.6vh; margin:3vh 0 1vh; flex-wrap:wrap; }
  #statsOverlay button { font-family:inherit; font-size:clamp(12px,1.7vh,16px); font-weight:bold;
    padding:.8vh 1.6vh; border-radius:1vh; color:#1a120a;
    border:2px solid #1a120a; background:linear-gradient(#f0d79a,#c9a85e); box-shadow:0 2px 0 #1a120a; }
  #statsOverlay button:disabled { opacity:.3; box-shadow:0 2px 0 #1a120a; transform:none; }
  #statsOverlay .day { color:#cba6ec; font-size:clamp(13px,2vh,20px); text-align:center; font-weight:bold; min-width:38vw; }
  #statsOverlay .pageno { text-align:center; color:#6f6a8a; font-size:clamp(10px,1.4vh,13px); margin-bottom:2.4vh; }
  #statsOverlay .sum { text-align:center; color:#9a95ad; font-size:clamp(12px,1.6vh,15px); margin-bottom:2.6vh; line-height:1.7; }
  #statsOverlay .sum b { color:#e7e0ff; }
  #statsOverlay table { width:100%; border-collapse:collapse; font-size:clamp(12px,1.7vh,16px); font-variant-numeric:tabular-nums; }
  #statsOverlay th, #statsOverlay td { padding:1vh .8vh; border-bottom:1px solid rgba(255,255,255,.08); text-align:left; }
  #statsOverlay th { color:#f8a8c4; text-transform:uppercase; font-size:clamp(10px,1.3vh,12px); letter-spacing:.1vh; }
  #statsOverlay .win-L { color:#cba6ec; font-weight:bold; }
  #statsOverlay .win-R { color:#f8a8c4; font-weight:bold; }
  #statsOverlay .dur, #statsOverlay .vir { text-align:right; white-space:nowrap; }
  #statsOverlay .score { white-space:nowrap; }
  #statsOverlay .score .sL { display:inline-block; min-width:4ch; text-align:right; }
  #statsOverlay .score .sR { display:inline-block; min-width:4ch; text-align:left; }
  #statsOverlay .empty { text-align:center; color:#9a95ad; margin:8vh 0; font-size:clamp(14px,1.9vh,18px); line-height:1.8; }
  #statsOverlay .overall { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07);
    border-radius:1.2vh; padding:2.4vh 2vh 2vh; margin:2.5vh 0 1vh; text-align:center; }
  #statsOverlay .overall .big { display:flex; justify-content:center; align-items:flex-end; gap:clamp(20px,5vw,56px);
    flex-wrap:wrap; margin-bottom:1.6vh; }
  #statsOverlay .overall .v { font-size:clamp(22px,4vh,40px); font-weight:bold; display:block; line-height:1; }
  #statsOverlay .overall .v.total { color:#f8d77e; }
  #statsOverlay .overall .l { font-size:clamp(10px,1.3vh,12px); color:#9a95ad; text-transform:uppercase; letter-spacing:.1vh; }
  #statsOverlay .overall .meta { color:#9a95ad; font-size:clamp(12px,1.6vh,15px); line-height:1.7; }
  #statsOverlay .overall .meta b { color:#e7e0ff; }
  #statsHint { position:sticky; bottom:0; text-align:center; padding:1.6vh 2vh 2vh;
    font-size:clamp(11px,1.6vh,15px); color:#8a86a8;
    background:linear-gradient(to top, #08080c 55%, rgba(8,8,12,0)); }
  #statsHint b { color:#f0d79a; }
</style>
</head>
<body>
  <div class="tv" id="tv">
    <div class="screen">
      <canvas id="game" width="720" height="576"></canvas>
      <div class="scanlines"></div>
      <div class="glow"></div>
      <div class="flicker"></div>
      <div class="crton"><div class="crton-beam"></div></div>
    </div>
    <div class="controls">
      <button id="btnStart" title="Start / zpět do menu">▶</button>
      <button id="btnFull" title="Celá obrazovka">⛶</button>
      <button id="btnMute" title="Zvuk zap/vyp">♪</button>
      <button id="btnStats" title="Statistiky">▥</button>
      <button id="btnInstall" title="Nainstalovat" hidden>⤓</button>
    </div>
    <div class="led"></div>
  </div>

  <!-- Statistiky jako overlay (kiosk / ovladače): otevírá se ze hry, ne přes samostatnou stránku -->
  <div id="statsOverlay" aria-hidden="true">
    <div class="stats" id="statsInner"></div>
    <div id="statsHint">◀ ▶ dny · ▲ ▼ posun · <b>Esc / Start</b> zpět do hry</div>
  </div>

<script src="audio.js"></script>
<script src="statsview.js"></script>
<script>
//================= SETUP =================
// ?tv -> kiosk režim pro fyzickou televizi (bez skříně a tlačítek)
// ?safe=90 -> doladí underscan proti overscanu televize (kolik % rámu je vidět).
//   100 = plný rám (jako dřív), níž = menší obraz. Kolik přesně ubrat se od stolu
//   neuhádne, každá CRT ukusuje jinak — proto se to ladí z URL, ne v kódu.
{
  const q = new URLSearchParams(location.search);
  if(q.has('tv')){
    document.body.classList.add('tvmode');
    const safe = parseFloat(q.get('safe'));
    if(safe >= 50 && safe <= 100) document.documentElement.style.setProperty('--tv-safe', safe/100);
  }
}

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
// Vnitřní souřadnice zůstávají 320×240, ale renderuje se do PAL bufferu 720×576.
const W = 320, H = 240;
ctx.scale(cv.width/W, cv.height/H);

const COLS = 8, ROWS = 16, CELL = 10;          // jako originální Dr. Mario
const LX0 = 70, RX0 = 170, BY = 46;            // board top-left positions
const BW = COLS*CELL, BH = ROWS*CELL;

const COLORS = ['P','G','R','V'];            // V = zelená, 4. barva jen v super-hardcore
let colorCount = 3;                          // kolik barev je aktivních (3, nebo 4 v super-hardcore)
const PAL = {                                // originální Dr. Mario barvy
  P:{c:'#4f7be8',l:'#a6c0f4',d:'#2a4496'},   // modrá
  G:{c:'#f0c83a',l:'#f8e07e',d:'#aa8512'},   // žlutá
  R:{c:'#e84b4b',l:'#f3a0a0',d:'#9e2222'},   // červená
  V:{c:'#3fc463',l:'#8ee6a4',d:'#1f7a3c'},   // zelená (4. barva super-hardcore)
};
const DIR = {U:[-1,0],D:[1,0],L:[0,-1],R:[0,1]};
const OPP = {U:'D',D:'U',L:'R',R:'L'};

const I = (r,c)=> r*COLS+c;

//================= HUDBA: napojení na stav hry =================
// Vlastní zvukový engine (Snd, toneAt, musicStart…) je ve sdíleném audio.js.
// Tady jen řekneme, KDY smí hudba hrát a JAK zrychluje s pádem kapslí.
musicShouldPlay = () => mode==='play' && !paused;
function gameSpeedProg(){   // 0 (start) … 1 (max rychlost) podle aktuální rychlosti pádu kapslí
  const span = DROP_START - DROP_MIN;
  return span>0 ? Math.max(0, Math.min(1, (DROP_START - dropIntervalNow())/span)) : 0;
}
function musicRate(){ return 1 + gameSpeedProg()*0.6; }               // 1,0× → 1,6×
musicRateFn = musicRate;

function togglePause(){
  if(mode!=='play' || ending) return;
  paused=!paused;
  if(paused){ pausePrev=performance.now(); musicStop(); pauseMusicStart(); }   // v pauze tichá klidná hudba
  else { padDropped=false; pauseMusicStop(); musicStart(); }                    // pokračování smaže hlášku o odpojení
}
// auto-pauza při ztrátě fokusu okna — hráč musí sám odpauzovat (P / Start)
function pauseGame(){
  if(mode!=='play' || ending || paused) return;
  paused=true; pausePrev=performance.now(); musicStop(); pauseMusicStart();
}
window.addEventListener('blur', pauseGame);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) pauseGame(); });
// předčasné ukončení hry (z pauzy) → zpět do menu, hra se nezapisuje do statistik
function quitToMenu(){
  paused=false; ending=false;
  swapMode=false; unflip();     // eastereggy platí jen pro odehranou hru
  mode='menu';
  musicStop(); pauseMusicStop();
}

// ---- Kiosk: návrat do menu po nečinnosti (attract) ----
// Když host odejde uprostřed hry nebo na výherní obrazovce, po IDLE_MS bez
// jakéhokoli vstupu se kiosk sám vrátí do menu, ať je pořád „zvoucí".
const IDLE_MS = 180000;                       // 3 min bez vstupu
let lastInputAt = performance.now();
function noteInput(){ lastInputAt = performance.now(); }   // volá se při každém vstupu (klávesa / ovladač / dotyk)
function idleToMenu(){
  if(mode==='menu') return;
  if(mode==='stats'){ closeStats(); noteInput(); return; }
  // 'play' i 'over': ukonči zvuk/hru, zruš eastereggy → menu (rozehraná hra se neukládá)
  stopAllSound(); musicStop(); pauseMusicStop();
  paused=false; ending=false; swapMode=false; unflip();
  mode='menu'; noteInput();
}
window.addEventListener('pointerdown', noteInput);   // dotyk / myš = taky vstup

//================= GAME STATE =================
let mode = 'menu';        // 'menu' | 'play' | 'over' | 'stats'
let players = [];
let winner = null;
let pendingAI = false;    // false = 2 hráči, true = vs počítač
// mrkání očí v menu — každý vstup blikne očima „své" postavičky (poznat, kdo koho ovládá)
let blinkGroom = 0, blinkBride = 0;
const BLINK_FRAMES = 9;
let frameCount = 0;
let bobPhase = 0;                        // fáze pohupování postaviček (zrychluje s tempem hry)
let level = 3;                          // 1..5 -> počet starostí
let countdownEnd = 0;                   // čas (ms) konce odpočtu 3·2·1
let gameStart = 0;                      // čas (ms) začátku hraní (po odpočtu)
let gameStartWall = 0;                  // reálný čas (Date.now) začátku hry — pro statistiky
let gameLogged = false;                 // zda už byla dohraná hra zapsána do statistik
let lastCdNum = 0;                       // poslední číslo odpočtu (pro pípnutí 3·2·1)
let pausePrev = 0;                       // čas (ms) poslední pauza-snímku (pro zmrazení času)
let paused = false;
let ending = false;                     // krátké zamrznutí po dohrání
let freezeEnd = 0;                      // čas (ms) konce zamrznutí
const FREEZE_MS = 900;
// remíza: kdo první skončí (doklikal viry NEBO umřel), dostane druhý krátké okno →
// když ho v okně dožene stejným způsobem, je remíza (jinak rozhodne, kdo doklikal)
let winPending = false;                 // běží okno, ve kterém může druhý dorovnat
let firstDone = null;                   // hráč, který skončil první
let firstOutcome = null;                // jak skončil první: 'win' (doklikal) | 'dead' (umřel)
let winDeadline = 0;                    // čas (ms), do kdy může druhý stihnout remízu
let isDraw = false;                     // hra skončila remízou
const WIN_GRACE_MS = 800;               // délka okna na dorovnání (i doba blikání po smrti)
const CLEAR_FRAMES = 28;                // jak dlouho je vidět outline po zmizení
const SQUASH_FRAMES = 7;                // délka dopadového „squash" po položení kapsle
const DAS_DELAY = 26, DAS_RATE = 9;    // posun do stran: 1× hned, prodleva, pak opakování
const SPAWN_GRACE = 8;                 // snímků po vysazení kapsle, kdy se ještě neuplatní soft drop
// Tempo AI: jakou část zbývajícího času do dopadu smí strávit manévrováním (zbytek dopadne
// soft dropem) a nejdelší pauza mezi dvěma akcemi ve snímcích. Bez stropu by AI na začátku
// hry (řádek za 95 snímků) čekala mezi otočkami vteřiny; bez podílu by naopak při rychlém
// pádu nestihla dojet. Hardcore má strop nižší, ať zůstane svižná.
const AI_PACE_USE = 0.5, AI_PACE_MAX = 11, AI_PACE_MAX_HARD = 5;
const VIRUS_LEVELS = [8,12,16,22,30];   // počet starostí pro úrovně 1..5
const COUNTDOWN_MS = 2500;              // 3 (0,5 s) + 2 (1 s) + 1 (1 s)
// pád kapsle: snímků na jedno políčko — start pomalý, zrychluje skokově.
// DROP_GRACE = úvodní vteřiny bez zrychlování; pak každých DROP_EVERY s ubere DROP_STEP snímků.
const DROP_START = 95, DROP_MIN = 22, DROP_STEP = 6, DROP_EVERY = 22, DROP_GRACE = 15;

// --- Hardcore easter egg (odemkne se v menu; zmizí po přenačtení stránky nebo po spuštění jiného než hardcore levelu) ---
let hardcoreUnlocked = false;          // jen v paměti → po reloadu stránky zase zmizí
let rightHoldFrames = 0;               // jak dlouho se v menu drží doprava (odemče po 5 s)
let maxRightPresses = 0;               // kolikrát po sobě zmáčknuto doprava na už nejvyšší obtížnosti

const WEDDING = { year:2026, month:8, day:7 };      // svatba 7. srpna 2026 → výročí od 7. 8. 2027
function anniversaryYears(){                         // >0 = kolikáté výročí dnes je (spustí se od dalšího roku)
  const d=new Date();
  if(d.getFullYear()>WEDDING.year && (d.getMonth()+1)===WEDDING.month && d.getDate()===WEDDING.day)
    return d.getFullYear()-WEDDING.year;
  return 0;
}

// jinak (jeden doklikal, druhý umřel) vyhrává ten, kdo doklikal.
function playerFinished(p, outcome){
  if(p.finishedOutcome || mode!=='play' || ending) return;
  p.finishedOutcome = outcome;
  if(outcome==='dead'){ p.dead = true; Snd.die(); rumble(players.indexOf(p), {strong:1.0, weak:0.9, dur:420}); }   // rozbliká se mu láhev + smutný zvuk + silná vibrace
  if(!winPending){
    winPending=true; firstDone=p; firstOutcome=outcome; winDeadline=performance.now()+WIN_GRACE_MS;
  } else if(p!==firstDone){
    if(outcome===firstOutcome) endGame(null,'draw');                 // oba stejně → remíza
    else endGame(outcome==='win' ? p : firstDone, 'win');            // doklikal jen jeden → ten vyhrál
  }
}
function checkCleared(p){                          // došel na 0 virů → doklikáno
  if(p.finishedOutcome || mode!=='play' || ending) return;
  if(countViruses(p.grid)===0) playerFinished(p,'win');
}

//================= BOARD LOGIC =================
// pill.r = spodní řada, pill.c = levý sloupec. Spodek zůstává na místě:
// vodorovná poloha je vždy v řadě r, svislá poloha roste nahoru (r, r-1).
// Svislé orientace střídají pravý / levý sloupec (pohyb do boků).
// Kostka má vždy ukotvenou buňku 4 = (r, c+1). Naležato zabírá 3-4 (řada r),
// svisle 2-4 (sloupec c+1). Otáčení tedy jen mění mezi těmito dvěma polohami
// a prohazuje barvy — nikdy neposouvá kostku doleva/doprava.
//   1-2     3 = (r, c)     4 = (r, c+1)
//   3-4     1 = (r-1, c)   2 = (r-1, c+1)
function cellsOf(pill){
  const {r,c,orient,ca,cb}=pill;
  switch(orient){
    case 0:  return [{r,     c,     color:ca, partner:'R'}, {r,     c:c+1, color:cb, partner:'L'}]; // naležato 3-4: ca vlevo
    case 1:  return [{r,     c:c+1, color:ca, partner:'U'}, {r:r-1, c:c+1, color:cb, partner:'D'}]; // svisle 2-4: ca dole
    case 2:  return [{r,     c:c+1, color:ca, partner:'L'}, {r,     c,     color:cb, partner:'R'}]; // naležato 3-4 (prohozené): ca vpravo
    default: return [{r:r-1, c:c+1, color:ca, partner:'D'}, {r,     c:c+1, color:cb, partner:'U'}]; // svisle 2-4 (prohozené): ca nahoře
  }
}
function canPlace(g, pill){
  for(const cl of cellsOf(pill)){
    if(cl.c<0 || cl.c>=COLS) return false;
    if(cl.r>=ROWS) return false;
    if(cl.r>=0 && g[I(cl.r,cl.c)]) return false;
  }
  return true;
}
function placeInto(g, pill){
  for(const cl of cellsOf(pill)){
    if(cl.r>=0) g[I(cl.r,cl.c)] = {color:cl.color, kind:'pill', partner:cl.partner};
  }
}
function countViruses(g){ let n=0; for(const c of g) if(c&&c.kind==='virus') n++; return n; }

function findClears(g){
  const mark = new Set(), runs = [];   // runs = barvy jednotlivých zničených řad/sloupců
  for(let r=0;r<ROWS;r++){
    let run=1;
    for(let c=1;c<=COLS;c++){
      const a = c<COLS ? g[I(r,c)] : null, b = g[I(r,c-1)];
      if(a&&b&&a.color===b.color) run++;
      else { if(run>=4){ for(let k=c-run;k<c;k++) mark.add(I(r,k)); runs.push(b.color); } run=1; }
    }
  }
  for(let c=0;c<COLS;c++){
    let run=1;
    for(let r=1;r<=ROWS;r++){
      const a = r<ROWS ? g[I(r,c)] : null, b = g[I(r-1,c)];
      if(a&&b&&a.color===b.color) run++;
      else { if(run>=4){ for(let k=r-run;k<r;k++) mark.add(I(k,c)); runs.push(b.color); } run=1; }
    }
  }
  return {mark, runs};
}
function clearMarked(g, mark){
  let virus=0;
  mark.forEach(idx=>{
    const cell = g[idx]; if(!cell) return;
    if(cell.partner){
      const [dr,dc] = DIR[cell.partner];
      const r=(idx/COLS)|0, c=idx%COLS, nr=r+dr, nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){
        const nb=g[I(nr,nc)];
        if(nb && nb.partner===OPP[cell.partner]) nb.partner=null;
      }
    }
    if(cell.kind==='virus') virus++;
    g[idx]=null;
  });
  return virus;
}
// jeden krok gravitace (spadnutí o 1 řádek), vrací true pokud se něco pohnulo
function gravityStep(g){
  const visited=new Array(g.length).fill(false);
  const groups=[];
  for(let r=ROWS-1;r>=0;r--) for(let c=0;c<COLS;c++){
    const i=I(r,c), cell=g[i];
    if(cell && cell.kind==='pill' && !visited[i]){
      const grp=[{r,c,i}]; visited[i]=true;
      if(cell.partner){
        const [dr,dc]=DIR[cell.partner], nr=r+dr, nc=c+dc;
        if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){
          const ni=I(nr,nc);
          if(g[ni]&&g[ni].kind==='pill'&&!visited[ni]){ grp.push({r:nr,c:nc,i:ni}); visited[ni]=true; }
        }
      }
      groups.push(grp);
    }
  }
  // Které skupiny mohou padat? Skupina padá, pokud je pod každou její buňkou
  // prázdno, buňka téže skupiny, NEBO buňka jiné skupiny, která taky padá.
  // (Bez toho by stoh volných kousků padal střídavě a vznikaly by mezi nimi mezery.)
  const cellGroup=new Map();                       // index buňky → číslo skupiny
  groups.forEach((grp,gi)=> grp.forEach(cl=> cellGroup.set(cl.i, gi)));
  const fall=new Array(groups.length).fill(true);
  let changed=true;
  while(changed){
    changed=false;
    for(let gi=0;gi<groups.length;gi++){
      if(!fall[gi]) continue;
      for(const cl of groups[gi]){
        const br=cl.r+1;
        if(br>=ROWS){ fall[gi]=false; changed=true; break; }        // podlaha
        const below=g[I(br,cl.c)];
        if(below){
          const bg=cellGroup.get(I(br,cl.c));
          if(bg===undefined || !fall[bg]){ fall[gi]=false; changed=true; break; } // pevná buňka pod ní (virus / stojící kousek)
        }
      }
    }
  }
  const movers=[];
  for(let gi=0;gi<groups.length;gi++){
    if(fall[gi]) for(const cl of groups[gi]) movers.push({obj:g[cl.i], from:cl.i, to:I(cl.r+1,cl.c)});
  }
  if(movers.length){
    for(const m of movers) g[m.from]=null;
    for(const m of movers) g[m.to]=m.obj;
    return true;
  }
  return false;
}
function gravity(g){ while(gravityStep(g)){} }   // okamžitá gravitace (pro AI)
// může vůbec něco spadnout? (bez mutace mřížky)
function anyCanFall(g){
  const visited=new Array(g.length).fill(false);
  for(let r=ROWS-1;r>=0;r--) for(let c=0;c<COLS;c++){
    const i=I(r,c), cell=g[i];
    if(cell && cell.kind==='pill' && !visited[i]){
      const grp=[{r,c}]; visited[i]=true;
      if(cell.partner){
        const [dr,dc]=DIR[cell.partner], nr=r+dr, nc=c+dc;
        if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){ const ni=I(nr,nc); if(g[ni]&&g[ni].kind==='pill'&&!visited[ni]){ grp.push({r:nr,c:nc}); visited[ni]=true; } }
      }
      let canFall=true;
      for(const cl of grp){ const br=cl.r+1; if(br>=ROWS){canFall=false;break;} const bi=I(br,cl.c); if(g[bi]&&!grp.some(x=>x.r===br&&x.c===cl.c)){canFall=false;break;} }
      if(canFall) return true;
    }
  }
  return false;
}
function resolveFull(g){
  gravity(g);
  let totalVirus=0, cells=0, chains=0; const cleared=[];
  while(true){
    const {mark}=findClears(g);
    if(mark.size===0) break;
    chains++; cells+=mark.size;
    mark.forEach(idx=> cleared.push({r:(idx/COLS)|0, c:idx%COLS}));
    totalVirus += clearMarked(g, mark);
    gravity(g);
  }
  return {totalVirus, cells, chains, cleared};
}

function countSame(g,r,c,dr,dc,color){
  let n=0,rr=r+dr,cc=c+dc;
  while(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&g[I(rr,cc)]&&g[I(rr,cc)].color===color){ n++; rr+=dr; cc+=dc; }
  return n;
}
function spawnViruses(g,n,topRow=5){
  let placed=0, att=0;
  const cap = n*1000 + 4000;                 // hodně starostí (hardcore) → víc pokusů na umístění
  const span = ROWS-topRow;                  // kolik řádků zdola je k dispozici (nahoře zůstává volno)
  while(placed<n && att<cap){
    att++;
    // ve druhé půli pokusů (v praxi jen u přeplněného hardcore) změkči pravidlo:
    // povol běh délky 3, ale nikdy ne 4 v řadě → žádné okamžité mazání na startu
    const lim = att > cap*0.5 ? 3 : 2;
    const r = topRow + ((Math.random()*span)|0);
    const c = (Math.random()*COLS)|0;
    const i = I(r,c); if(g[i]) continue;
    const color = randColor();
    if(countSame(g,r,c,0,-1,color)+countSame(g,r,c,0,1,color) >= lim) continue;
    if(countSame(g,r,c,-1,0,color)+countSame(g,r,c,1,0,color) >= lim) continue;
    g[i] = {color, kind:'virus', partner:null};
    placed++;
  }
}

//================= MOVES =================
function move(p,d){ if(!p.pill) return; const np={...p.pill,c:p.pill.c+d}; if(canPlace(p.grid,np)){ p.pill=np; if(!p.ai) Snd.move(); } }
// dir = +1 po směru hodinových ručiček, -1 proti směru
function rotate(p, dir=1){
  if(!p.pill) return;
  const no=(p.pill.orient+dir+4)%4;
  // zkus na místě, pak drobné „kicky" (od stěny / od stropu / od podlahy)
  for(const [dr,dc] of [[0,0],[0,-1],[0,1],[1,0],[1,-1],[1,1],[-1,0]]){
    const np={...p.pill,orient:no,r:p.pill.r+dr,c:p.pill.c+dc};
    if(canPlace(p.grid,np)){ p.pill=np; if(!p.ai) Snd.rotate(); return; }
  }
}
function lock(p){
  const cells=cellsOf(p.pill);
  // dopadový „squash": zapamatuj právě položené buňky, ať krátce cuknou
  p.landFx = { set:new Set(cells.filter(cl=>cl.r>=0).map(cl=>I(cl.r,cl.c))), t:SQUASH_FRAMES };
  // část kapsle, která čouhá nad horní hranu, se prostě zahodí (žádná smrt tady);
  // placeInto pokládá jen buňky s r>=0.
  placeInto(p.grid,p.pill);
  // pokud jedna půlka spadla mimo (nad hranu), druhá zůstane jako samostatný kousek
  for(const cl of cells){
    if(cl.r>=0 && cl.partner){
      const [dr,dc]=DIR[cl.partner];
      if(cl.r+dr<0){ const cell=p.grid[I(cl.r,cl.c)]; if(cell) cell.partner=null; }
    }
  }
  p.pill=null;
  if(!p.ai) Snd.lock();
  startResolve(p);
}
function dropGarbage(p){
  const q=p.pendingGarbage; p.pendingGarbage=[];
  // každý kousek do jiného sloupce (zamíchané pořadí); barva odpovídá zničené linii
  const cols=[]; for(let c=0;c<COLS;c++) cols.push(c);
  for(let i=cols.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [cols[i],cols[j]]=[cols[j],cols[i]]; }
  q.forEach((color, k)=>{
    // kousek cílí právě na svůj sloupec — plné nepřeskakujeme (padne-li shodná barva na vysoký
    // sloupec, může doplnit linii a odblokovat ho). Jen když je sloupec plný až nahoru, propadne.
    const c=cols[k%COLS];
    let r=0; while(r<ROWS && p.grid[I(r,c)]) r++;
    if(r<ROWS) p.grid[I(r,c)] = {color, kind:'pill', partner:null};
  });
}
// krokové (animované) řešení: padání -> outline -> mazání -> padání ...
function startResolve(p){
  p.busy=true; p.phase='settle'; p.phaseTimer=0;
  p.chains=0; p.gainCells=0; p.gainVir=0; p.gainGarbage=[]; p.flashes=[];
}
function resolveStep(p){
  if(p.phase==='settle'){
    if(anyCanFall(p.grid)){
      // kaskáda po smazání padá dvojnásobnou rychlostí než je aktuální gravitace
      if(++p.phaseTimer>=Math.max(1,dropIntervalNow()/2)){ p.phaseTimer=0; gravityStep(p.grid); }
    } else {
      const {mark,runs}=findClears(p.grid);
      if(mark.size>0){
        p.chains++; p.gainCells+=mark.size;
        const vBefore=p.gainVir;
        p.gainVir += clearMarked(p.grid, mark);     // kousky zmizí hned
        const vGained=p.gainVir-vBefore;            // starosti zničené tímto krokem
        if(vGained>0){                              // zmizela nějaká starost
          p.virusCount=countViruses(p.grid);        // → ihned sniž počítadlo dole (nečekej na konec kaskády)
          rumble(players.indexOf(p), {strong:0.4, weak:0.6, dur:100+vGained*40});   // IHNED zavibruj při zničení starosti
          if(p.virusCount===0) checkCleared(p);     // doklikáno → vítěz / okno na remízu
        } else {
          rumble(players.indexOf(p), {strong:0.15, weak:0.3, dur:60});             // jen smazané kostičky
        }
        // posbírej barvy všech zničených řad/sloupců za celý tah;
        // finishResolve pak podle jejich počtu (od dvou výš) pošle smetí soupeři
        for(const col of runs) p.gainGarbage.push(col);
        p.flashes=[]; mark.forEach(i=>p.flashes.push({r:(i/COLS)|0, c:i%COLS}));
        if(p.gainVir>0) p.animClear=26;
        if(p.gainVir>vBefore) Snd.virus(); else Snd.clear(p.chains);   // smazání starosti zní jasněji
        p.phase='clear'; p.phaseTimer=0;            // outline zůstane chvíli viset
      } else {
        finishResolve(p);
      }
    }
  } else { // 'clear' — drž outline, pak zase padej
    if(++p.phaseTimer>=CLEAR_FRAMES){ p.flashes=[]; p.phase='settle'; p.phaseTimer=0; }
  }
}
function finishResolve(p){
  p.busy=false; p.flashes=[];
  // smetí: záleží jen na tom, kolik řad/sloupců hráč v tahu zničil (ne na starostech).
  // Posílá se od DVOU zničených linií výš — tolik kostiček, kolik bylo linií. Jedna linie = nic.
  // Barvy odpovídají zničeným liniím.
  // (vibrace za zničení starostí/kostiček řeší resolveStep hned, ne až tady na konci kaskády)
  const garbage = p.gainGarbage.length>=2 ? p.gainGarbage : [];
  if(garbage.length){
    const o = swapMode ? p : other(p);       // swap egg: smetí letí sám na sebe místo na soupeře
    for(const col of garbage){ if(o.pendingGarbage.length<10) o.pendingGarbage.push(col); }
    Snd.attack(garbage.length, p.side);      // dramatická znělka útoku (jinak pro ženicha/nevěstu)
    if(!o.ai) Snd.garbage();                 // příjemce (člověk) slyší příchozí smetí
    rumble(players.indexOf(o), {strong:0.9, weak:0.7, dur:130+garbage.length*30});   // náraz příjemci smetí
  }
  if(p.chains>1){ p.comboTimer=46; p.comboN=p.chains; Snd.combo(p.chains); }
  p.score += p.gainCells*10 + p.gainVir*50;
  p.virusCount=countViruses(p.grid);
  if(p.virusCount===0) checkCleared(p);
}

function endGame(p,res){
  if(ending || mode==='over') return;
  paused=false;
  ending=true;                               // na chvíli zamrzni, pak výherní obrazovka
  freezeEnd=performance.now()+FREEZE_MS;
  if(res==='draw'){ isDraw=true; winner=null; }   // remíza — bez vítěze
  else {
    winner = (res==='win') ? p : other(p);
    if(res==='lose') p.dead=true;            // p se zaplácal až nahoru → blikne mu celá láhev
  }
  musicStop(); pauseMusicStop();
  Snd.win();
  // krátká oslavná vibrace vítězi (u remízy oběma)
  if(isDraw){ rumble(0,{strong:0.6,weak:0.8,dur:260}); rumble(1,{strong:0.6,weak:0.8,dur:260}); }
  else if(winner) rumble(players.indexOf(winner), {strong:0.7, weak:0.9, dur:320});
  logGame();
}
function logGame(){
  if(gameLogged || (!winner && !isDraw)) return;
  gameLogged=true;
  const durationMs = Math.max(0, Math.round(performance.now()-gameStart));
  saveGame({
    startedAt: gameStartWall,
    endedAt: Date.now(),
    durationMs,
    level,                              // 1..5 (6 = hardcore)
    viruses: virusesAt(level),          // počet starostí
    vsAI: !!players[1].ai,
    winner: isDraw ? 'draw' : winner.side,   // 'L' = ženich, 'R' = nevěsta, 'draw' = remíza
    scoreL: players[0].score,
    scoreR: players[1].score,
  });
}

//================= AI =================
function gridClone(g){ return g.map(c=> c?{...c}:null); }
function topHeight(g){
  let h=0;
  for(let c=0;c<COLS;c++){ for(let r=0;r<ROWS;r++){ if(g[I(r,c)]){ h=Math.max(h,ROWS-r); break; } } }
  return h;
}
function countHoles(g){
  let holes=0;
  for(let c=0;c<COLS;c++){
    let seen=false;
    for(let r=0;r<ROWS;r++){ if(g[I(r,c)]) seen=true; else if(seen) holes++; }
  }
  return holes;
}
// všechna možná umístění kapsle (barvy ca/cb) na desku g: spadne dolů, vyřeší se kaskáda
// Postih za položení DVOUBAREVNÉ kapsle nastojato. Svislá dvoubarevná si zamkne
// jednu barvu pod druhou ve sloupci a snadno si tím AI zaveze desku; naležato se
// obě barvy rozloží do dvou sloupců. Jednobarevná svislá se netrestá — ta je čistý
// příspěvek ke svislé čtveřici, takže „na výšku jen když je to extra dobré".
// 0 = vypnuto (původní chování).
//
// Měřeno na 80 simulovaných partiích (dvoubarevné naležato / zbylé viry z 16):
//   0 → 44.6 % / 6.64      25  → 82.0 % / 6.19      150 → 96.9 % / 4.71
//   6 → 61.0 % / 7.04      60  → 92.4 % / 4.90      400 → 97.2 % / 4.38
// Pozor, není to kompromis: AI je s tím i výrazně SILNĚJŠÍ (4.7 vs 6.6 zbylých virů)
// a míň si zasypává starosti. Nad ~150 už se to jen plazí, proto 150.
let AI_VERT_MIX_PEN = 150;
function aiPlacements(g, ca, cb){
  const out=[];
  const mixed = ca!==cb;
  for(let o=0;o<4;o++) for(let c=0;c<COLS;c++){
    let pill={r:0,c,orient:o,ca,cb};
    if(!canPlace(g,pill)) continue;
    while(canPlace(g,{...pill,r:pill.r+1})) pill={...pill,r:pill.r+1};
    if(cellsOf(pill).some(cl=>cl.r<0)) continue;        // čouhá nad hranu → smrt, přeskoč
    const ng=gridClone(g);
    placeInto(ng,pill);
    const res=resolveFull(ng);
    const vpen = (mixed && (o===1||o===3)) ? AI_VERT_MIX_PEN : 0;
    out.push({col:c, orient:o, r:pill.r, g:ng, res, vpen});
  }
  return out;
}
// kvalita desky (vyšší = lepší): trestá zbylé viry, díry, výšku a nerovnost;
// ODMĚŇUJE stejnobarevné sousedy (staví linie vedoucí ke smazání virů)
// Jak moc se AI smí snažit STAVĚT vodorovné čtveřice (napříč sloupci).
// 1 = stejně jako svislé (původní chování), 0 = vodorovné linie si vůbec necení.
// Vodorovné mazání vypadá nepřirozeně a hůř se čte, proto je přibrzděné.
// Měřeno na 150 simulovaných partiích (podíl virů zničených vodorovně / zbylé viry):
//   1.0 → 45.6 % / 6.1     0.2 → 41.5 % / 6.1
//   0.3 → 42.5 % / 6.0     0.1 → 37.6 % / 6.3     0 → 24.1 % / 6.9
// Pozn.: páka je slabší, než by se čekalo — o sebrání viru rozhoduje hlavně
// -countViruses*1000 (deska se hodnotí až PO resolveFull), tohle ovlivňuje jen stavění.
let AI_HORIZ_W = 0.1;
// Odměna za stejnobarevné sousedy (staví budoucí čtveřice). Když AI nemá dobrý tah,
// tohle rozhoduje, jestli barvy skládá na sebe, nebo je jen náhodně rozhazuje.
// Původně 2 — proti holes*22 drobek, takže se barvy skládaly jen když to nic nestálo.
//
// Měřeno na 80 partiích (podíl svislých dvojic se stejnou barvou / zbylé viry / zasypání):
//   2 → 47.9 % / 4.45 / 9.54      25  → 56.0 % / 4.96 / 8.44
//   6 → 52.2 % / 4.89 / 9.14      50  → 57.5 % / 5.92 / 7.92
//  12 → 53.8 % / 4.91 / 9.21     100  → 59.3 % / 6.64 / 7.87
// Nad 25 se skládání už jen plazí, ale síla znatelně padá — proto 25.
let AI_ADJ_W = 25;
function aiEval(g){
  let holes=0, aggH=0, bump=0, adjH=0, adjV=0, vadjH=0, vadjV=0;
  const H=new Array(COLS).fill(0);
  for(let c=0;c<COLS;c++){
    let seen=false;
    for(let r=0;r<ROWS;r++){
      const cell=g[I(r,c)];
      if(cell){
        if(!seen){ H[c]=ROWS-r; seen=true; }
        const rN = c+1<COLS ? g[I(r,c+1)] : null;   // soused vpravo → vodorovná linie
        const dN = r+1<ROWS ? g[I(r+1,c)] : null;   // soused dole   → svislá linie
        if(rN&&rN.color===cell.color){ adjH++; if(cell.kind==='virus'||rN.kind==='virus') vadjH++; }
        if(dN&&dN.color===cell.color){ adjV++; if(cell.kind==='virus'||dN.kind==='virus') vadjV++; }
      } else if(seen) holes++;
    }
    aggH+=H[c];
  }
  for(let c=0;c<COLS-1;c++) bump+=Math.abs(H[c]-H[c+1]);
  const maxH=Math.max(...H);
  // vadj (shoda barvy přímo u viru) je cennější než běžná shoda — vede rovnou ke smazání starosti
  return -countViruses(g)*1000 - holes*22 - aggH*0.8 - bump*2 - maxH*maxH*0.35
       + adjV*AI_ADJ_W + adjH*AI_ADJ_W*AI_HORIZ_W + vadjV*40 + vadjH*40*AI_HORIZ_W;
}
// hardcore: rozmýšlej 2 kapsle dopředu — po každém umístění zkus nejlepší reakci další kapslí.
// Předfiltr: hluboko (2-ply) prozkoumej jen nejlepších K umístění podle rychlého 1-ply (svižnost).
function aiPlanDeep(p){
  const all=aiPlacements(p.grid, p.pill.ca, p.pill.cb);
  if(all.length===0) return {score:-1e18, col:(COLS/2|0)-1, orient:0, r:ROWS-1};
  // vpen = postih za svislou dvoubarevnou kapsli; u vítězného tahu se neuplatní,
  // ať AI kvůli stylu nezahodí smazání poslední starosti
  for(const pl of all) pl.q = countViruses(pl.g)===0 ? 1e9 : aiEval(pl.g) - pl.vpen;
  all.sort((a,b)=>b.q-a.q);
  const first = all.slice(0, AIK);
  let best={score:-1e18, col:first[0].col, orient:first[0].orient, r:first[0].r};
  for(const pl of first){
    let val;
    if(countViruses(pl.g)===0){ val = 1e9 + pl.r; }        // vítězný tah (smazal poslední virus)
    else {
      const sec=aiPlacements(pl.g, p.next.ca, p.next.cb);
      if(sec.length===0){ val = -1e12; }                    // po tomto tahu se další kapsle nevejde → hrozí smrt
      else { let m=-1e18; for(const s of sec){ const e = countViruses(s.g)===0 ? 1e8 : aiEval(s.g); if(e>m) m=e; } val=m - pl.vpen; }
    }
    if(val>best.score) best={score:val, col:pl.col, orient:pl.orient, r:pl.r};
  }
  return best;
}
// Kolik nejlepších 1-ply tahů se promýšlí do hloubky. Zbytek se zahodí podle rychlého
// 1-ply hodnocení — když je K moc malé, AI vyhodí dobrý tah dřív, než se na něj podívá.
// Měřeno (zbylé viry z 80 partií / čas jednoho rozhodnutí v Chromiu na kiosku, Celeron N4505):
//   6 → 5.25 / 4.90 ms      12 → 4.08 / 6.26 ms      24 → 4.12 / 12.35 ms
// Nad 12 už se síla nezlepší, jen roste cena. Rozhodnutí padne 1× na kapsli a snímek má
// 16.7 ms, takže 6.26 ms je s rezervou. (Bylo 6 kvůli Raspberry Pi, to už se nepoužívá.)
let AIK=12;
function computeAiPlan(p){
  if(p.next) return aiPlanDeep(p);   // chytřejší plánování 2 kapsle dopředu (všechny úrovně)
  let best={score:-1e9, col:(COLS/2|0)-1, orient:0};
  for(let o=0;o<4;o++) for(let c=0;c<COLS;c++){
    let pill={r:0,c,orient:o,ca:p.pill.ca,cb:p.pill.cb};
    if(!canPlace(p.grid,pill)) continue;
    while(canPlace(p.grid,{...pill,r:pill.r+1})) pill={...pill,r:pill.r+1};
    if(cellsOf(pill).some(cl=>cl.r<0)) continue;
    const g=gridClone(p.grid);
    placeInto(g,pill);
    const res=resolveFull(g);
    const score = res.totalVirus*1000 + res.cells*8 - topHeight(g)*4 - countHoles(g)*9 + pill.r*2;
    if(score>best.score) best={score,col:c,orient:o};
  }
  return best;
}
function aiThink(p){
  if(!p.pill) return;
  if(!p.aiPlan) p.aiPlan=computeAiPlan(p);
  const pl=p.aiPlan;
  // jakmile je kapsle na cíli (sloupec i otočení), rychle ji polož (soft drop); jinak padá normálně
  p.padDrop = (p.pill.orient===pl.orient && p.pill.c===pl.col);
  if(p.aiTimer>0){ p.aiTimer--; return; }

  // Rozlož akce do času, který kapsli zbývá do dopadu. Dřív se čekalo natvrdo 4 snímky,
  // takže AI hned po vysazení odpálila všechny otočky naráz a pak jen stála — vypadalo to
  // jako škubnutí. Teď si tempo spočítá: kolik akcí zbývá vs. kolik snímků zbývá do dopadu.
  // Strop drží tempo lidské i když je času přehršel (na startu padá řádek 95 snímků);
  // když se dopad blíží, podíl tempo sám zrychlí, ať AI stihne dojet na cíl.
  const rotLeft  = (pl.orient - p.pill.orient + 4) % 4;
  const actions  = rotLeft + Math.abs(pl.col - p.pill.c);
  if(actions > 0){
    // Uzávěrka je „kolik řádků kapsle ještě spadne ODSUD", ne cílový řádek plánu:
    // kapsle zatím padá ve výchozím sloupci, a když je uprostřed vysoká hromada,
    // dopadne tam dřív, než by dojela na cíl. (Podle pl.r to minulo cíl 3 % kapslí.)
    let rowsLeft = 0, probe = p.pill;
    while(canPlace(p.grid, {...probe, r:probe.r+1})) { probe = {...probe, r:probe.r+1}; rowsLeft++; }
    const framesLeft = Math.max(1, rowsLeft) * dropIntervalNow();
    const paced      = Math.floor(framesLeft * AI_PACE_USE / (actions + 1));
    const maxWait    = level>=6 ? AI_PACE_MAX_HARD : AI_PACE_MAX;
    p.aiTimer = Math.max(level>=6 ? 2 : 3, Math.min(maxWait, paced));
  } else p.aiTimer = level>=6 ? 2 : 4;

  if(p.pill.orient!==pl.orient) rotate(p);
  else if(p.pill.c<pl.col) move(p,1);
  else if(p.pill.c>pl.col) move(p,-1);
}

//================= UPDATE =================
function startGame(ai){
  if(level<6){ hardcoreUnlocked=false; superUnlocked=false; }   // po normální hře se tvrdé módy zase schovají
  if(level!==0) zeroUnlocked=false;          // po jiné než nulté hře se nultá úroveň zase znedostupní
  colorCount = level>=7 ? 4 : 3;             // super-hardcore přidá 4. (zelenou) barvu
  maxRightPresses=0; rightHoldFrames=0;
  const nv = virusesAt(level);
  players=[newPlayer('L'), newPlayer('R')];
  // Stejná obtížnost → stejné výchozí rozložení starostí pro oba hráče:
  // vygeneruj jedno a zkopíruj do obou mřížek (kopie buněk, ne sdílené reference).
  const template = new Array(COLS*ROWS).fill(null);
  if(level<=0){
    // nultá úroveň: jediná starost a všechny pilulky té samé barvy (triviální)
    pillColorLock = randColor();
    const r = 5 + ((Math.random()*(ROWS-5))|0), c = (Math.random()*COLS)|0;
    template[I(r,c)] = {color:pillColorLock, kind:'virus', partner:null};
  } else {
    pillColorLock = null;
    // hardcore smí sáhnout o řádek výš — volné zůstanou jen první 4 řádky (jinak 5)
    spawnViruses(template, nv, level>=6 ? 4 : 5);
  }
  for(const p of players){
    for(let i=0;i<template.length;i++) p.grid[i] = template[i] ? {...template[i]} : null;
    p.virusCount=countViruses(p.grid);
  }
  // stejné pořadí kapslí pro oba — sdílená sekvence od začátku
  pillSeq=[];
  for(const p of players){ p.pillIdx=0; p.next=pillAt(0); }
  players[1].ai = ai;
  winner=null;
  winPending=false; firstDone=null; firstOutcome=null; isDraw=false;   // reset stavu remízy
  paused=false;
  ending=false;
  padDropped=false;                        // nová hra → zruš případnou hlášku o odpojení ovladače
  countdownEnd=performance.now()+COUNTDOWN_MS;
  gameStart=countdownEnd;
  gameStartWall=Date.now()+COUNTDOWN_MS;   // reálný čas, kdy hra po odpočtu začne
  gameLogged=false;
  lastCdNum=0;
  audioInit();                             // start je gesto uživatele → rozběhni zvuk
  mode='play';
  musicStop(); musicStart();               // hudba na pozadí (hraje i během odpočtu)
}
function dropIntervalNow(){
  // rychlost roste skokově: po odečtení grace každých DROP_EVERY sekund o DROP_STEP snímků
  const sec = Math.max(0, (performance.now()-gameStart)/1000 - DROP_GRACE);
  const steps = Math.floor(sec / DROP_EVERY);
  return Math.max(DROP_MIN, DROP_START - steps*DROP_STEP);
}
// drží hráč klávesu „dolů"? (WASD=ženich, šipky=nevěsta; v sólu ovládají šipky člověka=ženicha)
function humanDownHeld(p){
  if(p.ai) return false;
  const solo = players[1].ai;
  if(p===players[0]) return !!keyHeld['KeyS'] || (solo && !!keyHeld['ArrowDown']);
  return !solo && !!keyHeld['ArrowDown'];
}
function updatePlayer(p){
  if(mode!=='play') return;
  if(winPending && p===firstDone) return;    // už doklikal → zamrzne a čeká, jestli druhý dorovná
  if(p.busy){ resolveStep(p); return; }      // animace padání / mazání
  if(!p.pill){
    if(p.pendingGarbage.length>0){ dropGarbage(p); startResolve(p); return; }   // smetí spadne animovaně
    p.virusCount=countViruses(p.grid);
    if(p.virusCount===0){ checkCleared(p); return; }
    const np=p.next; p.next=pillAt(++p.pillIdx);   // další kapsle ze sdílené sekvence
    p.pill={r:0, c:(COLS/2|0)-1, orient:0, ca:np.ca, cb:np.cb};
    p.aiPlan=null;
    p.spawnGrace=SPAWN_GRACE;   // krátká grace, ať nová kapsle při drženém „dolů" hned neproletí
    if(!canPlace(p.grid,p.pill)){ p.pill=null; playerFinished(p,'dead'); return; }
    p.dropTimer=0;
    return;
  }
  if(p.ai) aiThink(p);
  if(p.spawnGrace>0) p.spawnGrace--;
  // soft drop = drží se „dolů" (klávesnice nebo ovladač); funguje průběžně i pro další kapsle
  const soft = p.spawnGrace<=0 && (humanDownHeld(p) || p.padDrop);
  p.dropTimer += soft ? 7 : 1;
  if(p.dropTimer>=dropIntervalNow()){
    p.dropTimer=0;
    const np={...p.pill,r:p.pill.r+1};
    if(canPlace(p.grid,np)) p.pill=np; else lock(p);
  }
}
function update(){
  if(ending){ if(performance.now()>=freezeEnd){ ending=false; mode='over'; winPending=false; noteInput(); } return; }   // výsledek → přestat blikat (a nastartuj idle okno pro výherní obrazovku)
  if(paused){
    // pauza zmrazí čas: posuň časové kotvy, aby „zbývající" odpočet i náběh rychlosti stály
    const t=performance.now(), dt=t-pausePrev; pausePrev=t;
    const inCountdown = t < countdownEnd;
    countdownEnd+=dt; gameStart+=dt;
    if(inCountdown) gameStartWall+=dt;   // reálný start hry se posouvá jen když pauza padne do odpočtu
    return;
  }
  const cdRem = countdownEnd - performance.now();
  if(cdRem > 0){
    const elapsed = COUNTDOWN_MS - cdRem;
    const num = elapsed < 500 ? 3 : elapsed < 1500 ? 2 : 1;
    if(num!==lastCdNum){ lastCdNum=num; Snd.count(false); }   // pípnutí 3·2·1
    return;
  }
  if(lastCdNum>0){ lastCdNum=0; Snd.count(true); }            // start! vyšší pípnutí
  for(const p of players) updatePlayer(p);
  for(const p of players){
    if(p.comboTimer>0) p.comboTimer--;
    if(p.animClear>0) p.animClear--;
    if(p.landFx && --p.landFx.t<=0) p.landFx=null;   // dopadový squash odezní
  }
  // vypršelo okno na dorovnání → rozhodne konec prvního hráče
  if(winPending && !ending && performance.now()>=winDeadline){
    if(firstOutcome==='win') endGame(firstDone,'win');        // doklikal → vyhrál
    else endGame(other(firstDone),'win');                      // umřel → vyhrál soupeř
  }
}

//================= RENDER =================
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function T(t,x,y,size,color,align='center',bold=false){
  ctx.font=(bold?'bold ':'')+size+'px "Courier New",monospace';
  ctx.textAlign=align; ctx.textBaseline='alphabetic';
  ctx.fillStyle=color; ctx.fillText(t,x,y);
}
function bgScreen(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a2140'); g.addColorStop(1,'#0a0d1c');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function drawCell(x,y,cell){
  const p=PAL[cell.color];
  if(cell.kind==='virus'){
    // živá starost: pohupování, občasné mrknutí a koukání do stran (fáze podle pozice, ať nedělají naráz)
    const ph = x*13 + y*7;
    const wob = Math.sin(frameCount*0.08 + ph*0.3)*0.5;        // jemné pohupování
    const blink = Math.sin(frameCount*0.045 + ph) > 0.95;      // občasné mrknutí
    const look = Math.round(Math.sin(frameCount*0.03 + ph*0.5))*0.7;   // koukání vlevo/vpravo
    y += wob;
    ctx.fillStyle=p.d; rr(x+1.5,y+1.5,CELL-3,CELL-3,4); ctx.fill();
    ctx.fillStyle=p.c; rr(x+2.5,y+2.5,CELL-5,CELL-5,3); ctx.fill();
    if(blink){
      ctx.fillStyle='#1a0a14';
      ctx.fillRect(x+CELL*0.28, y+CELL*0.45, 2, 1);            // zavřená víčka (čárky)
      ctx.fillRect(x+CELL*0.58, y+CELL*0.45, 2, 1);
    } else {
      ctx.fillStyle='#fff';
      ctx.fillRect(x+CELL*0.28,y+CELL*0.36,2,2.4);
      ctx.fillRect(x+CELL*0.58,y+CELL*0.36,2,2.4);
      ctx.fillStyle='#1a0a14';
      ctx.fillRect(x+CELL*0.30+look,y+CELL*0.44,1.4,1.4);      // panenky se dívají do stran
      ctx.fillRect(x+CELL*0.60+look,y+CELL*0.44,1.4,1.4);
    }
    ctx.fillStyle='#2a0c1a'; ctx.fillRect(x+CELL*0.34,y+CELL*0.66,CELL*0.34,1.4);
  } else {
    ctx.fillStyle=p.c; rr(x+1,y+1,CELL-2,CELL-2,4); ctx.fill();
    // silný spoj směrem k partnerovi (jasně ukazuje, které kousky drží spolu)
    if(cell.partner){
      const T=CELL*0.62, O=(CELL-T)/2;
      if(cell.partner==='R') ctx.fillRect(x+CELL*0.5, y+O, CELL*0.5+0.5, T);
      else if(cell.partner==='L') ctx.fillRect(x-0.5, y+O, CELL*0.5+0.5, T);
      else if(cell.partner==='D') ctx.fillRect(x+O, y+CELL*0.5, T, CELL*0.5+0.5);
      else if(cell.partner==='U') ctx.fillRect(x+O, y-0.5, T, CELL*0.5+0.5);
    }
    ctx.fillStyle=p.l; rr(x+2.6,y+2.6,CELL*0.32,CELL*0.32,2); ctx.fill();
  }
}
// obrys sklenice à la Dr. Mario: svislé stěny → zaoblená ramena → svislý krk →
// obdélníkový nákružek (lem), který na samém vrcholu vystupuje ven přes krk.
function drawGlass(x0){
  const cx=x0+BW/2;
  const bodyHalf=BW/2;           // stěny přesně na hraně hracího pole → nic nepřesahuje
  const neckHalf=CELL*1.5;        // svislý krk
  const lipHalf=CELL*2;           // lem (širší než krk, ale pořád uvnitř pole)
  const bottom=BY+BH+2, r=3;
  const bodyTopY=BY-1;            // horní hrana těla (vodorovné bočnice)
  const lipBaseY=bodyTopY-7;      // vršek krku / pata lemu
  const lipTopY=lipBaseY-2;       // vrch lemu
  ctx.save();
  ctx.lineJoin='miter'; ctx.lineCap='butt';    // hranaté rohy
  ctx.beginPath();
  ctx.moveTo(cx-bodyHalf, bottom-r);
  ctx.lineTo(cx-bodyHalf, bodyTopY+r);                   // levá stěna nahoru
  ctx.arcTo(cx-bodyHalf, bodyTopY, cx-bodyHalf+r, bodyTopY, r);   // zaoblený levý horní roh
  ctx.lineTo(cx-neckHalf, bodyTopY);                     // vodorovná levá bočnice
  ctx.lineTo(cx-neckHalf, lipBaseY);                     // krk nahoru
  ctx.lineTo(cx-lipHalf, lipBaseY);                      // nákružek ven
  ctx.lineTo(cx-lipHalf, lipTopY);                       // nákružek nahoru
  ctx.lineTo(cx+lipHalf, lipTopY);                       // vrch nákružku
  ctx.lineTo(cx+lipHalf, lipBaseY);                      // nákružek dolů
  ctx.lineTo(cx+neckHalf, lipBaseY);                     // nákružek dovnitř
  ctx.lineTo(cx+neckHalf, bodyTopY);                     // krk dolů
  ctx.lineTo(cx+bodyHalf-r, bodyTopY);                   // vodorovná pravá bočnice
  ctx.arcTo(cx+bodyHalf, bodyTopY, cx+bodyHalf, bodyTopY+r, r);   // zaoblený pravý horní roh
  ctx.lineTo(cx+bodyHalf, bottom-r);                     // pravá stěna dolů
  ctx.arcTo(cx+bodyHalf, bottom, cx+bodyHalf-r, bottom, r);   // pravý dolní roh
  ctx.lineTo(cx-bodyHalf+r, bottom);
  ctx.arcTo(cx-bodyHalf, bottom, cx-bodyHalf, bottom-r, r);   // levý dolní roh
  ctx.closePath();
  ctx.strokeStyle='rgba(150,205,235,0.8)'; ctx.lineWidth=2.4; ctx.stroke();   // sklo
  ctx.strokeStyle='rgba(220,245,255,0.9)'; ctx.lineWidth=1; ctx.stroke();     // vnitřní lesk
  ctx.restore();
}
function drawBoard(p,x0){
  ctx.fillStyle='#0c1226'; ctx.fillRect(x0,BY,BW,BH);
  ctx.strokeStyle='rgba(255,255,255,0.045)'; ctx.lineWidth=1;
  for(let c=1;c<COLS;c++){ ctx.beginPath(); ctx.moveTo(x0+c*CELL,BY); ctx.lineTo(x0+c*CELL,BY+BH); ctx.stroke(); }
  for(let r=1;r<ROWS;r++){ ctx.beginPath(); ctx.moveTo(x0,BY+r*CELL); ctx.lineTo(x0+BW,BY+r*CELL); ctx.stroke(); }

  // úmrtí: obsah láhve bliká (mizí a zase se objeví) — během okna na remízu i závěrečného zamrznutí
  const blinkHide = p.dead && (winPending || ending) && (Math.floor(frameCount/6)%2===1);
  if(!blinkHide) for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const cell=p.grid[I(r,c)];
    if(!cell) continue;
    const cx=x0+c*CELL, cy=BY+r*CELL;
    if(p.landFx && p.landFx.set.has(I(r,c))){
      // dopadový squash: krátce zploští a rozšíří, ukotveno u spodní hrany buňky
      const k=p.landFx.t/SQUASH_FRAMES, ax=cx+CELL/2, ay=cy+CELL;
      ctx.save(); ctx.translate(ax,ay); ctx.scale(1+0.22*k, 1-0.34*k); ctx.translate(-ax,-ay);
      drawCell(cx, cy, cell);
      ctx.restore();
    } else drawCell(cx, cy, cell);
  }
  // outline tam, kde kousky zmizely (vidět delší dobu)
  for(const f of p.flashes){
    const x=x0+f.c*CELL, y=BY+f.r*CELL;
    ctx.strokeStyle='rgba(255,255,255,0.92)'; ctx.lineWidth=1.5;
    rr(x+1.6,y+1.6,CELL-3.2,CELL-3.2,3); ctx.stroke();
  }
  if(p.pill){
    for(const cl of cellsOf(p.pill)){
      if(cl.r>=0) drawCell(x0+cl.c*CELL, BY+cl.r*CELL, {color:cl.color,kind:'pill',partner:cl.partner});
    }
  }
  // glass frame (tělo i hrdlo v jednom obrysu, aby hrdlo navazovalo na sklenici)
  drawGlass(x0);
  ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.fillRect(x0+2,BY+2,3,BH-6);

  if(p.comboTimer>0){
    const a=Math.min(1,p.comboTimer/20);
    T('KOMBO ×'+p.comboN, x0+BW/2, BY+BH/2, 11, 'rgba(248,215,126,'+a+')','center',true);
  }
  if(p.pendingGarbage.length>0){
    // do vnějšího horního rohu, ať nepřekrývá nápis ŽENICH / NEVĚSTA uprostřed
    const onL = p.side==='L';
    T('⚠'+p.pendingGarbage.length, onL ? x0-1 : x0+BW+1, BY-6, 8, '#ff9d5d', onL?'left':'right', true);
  }
}

function drawBride(cx, feetY, s, blink){ person(cx,feetY,s,(r)=>{ (swapMode?groomBody:brideBody)(r); brideHead(r,blink); }); }
function drawCrown(cx, topY, s){
  const w=14*s, bh=3*s, ph=5.5*s, step=w/3;
  ctx.fillStyle='#ffd94a';
  ctx.fillRect(cx-w/2, topY, w, bh);
  for(let i=0;i<3;i++){
    const x=cx-w/2+i*step;
    ctx.beginPath();
    ctx.moveTo(x,topY); ctx.lineTo(x+step/2,topY-ph); ctx.lineTo(x+step,topY);
    ctx.fill();
  }
}
function heart(x,y,sz,col){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(x,y+sz*0.3);
  ctx.bezierCurveTo(x,y,x-sz,y,x-sz,y+sz*0.35);
  ctx.bezierCurveTo(x-sz,y+sz*0.7,x,y+sz*0.9,x,y+sz*1.15);
  ctx.bezierCurveTo(x,y+sz*0.9,x+sz,y+sz*0.7,x+sz,y+sz*0.35);
  ctx.bezierCurveTo(x+sz,y,x,y,x,y+sz*0.3);
  ctx.fill();
}

function drawMini(x,y,color,s){

//================= LOOP =================
// Pevný časový krok 60 Hz: herní logika (pád, animace) běží podle reálného času,
// takže i při nižším fps (třeba na Raspberry Pi) je rychlost hry i těžknutí konzistentní.
// Vykresluje se jednou za snímek; vstup se čte jednou za snímek.
let prevT=null, tAcc=0; const STEP=1000/60;
let lastFrameErr=0;                         // throttling logu chyb (ať nespamuje konzoli)
function frame(now){
  // Celá smyčka je v try/catch: jednorázová výjimka v logice/kreslení nesmí shodit
  // requestAnimationFrame níže — jinak by kiosk navždy zamrzl a na akci to nikdo nerozchodí.
  try{
    if(prevT===null) prevT=now;
    let dt=now-prevT; prevT=now;
    if(dt>250) dt=250;                       // po přepnutí tabu apod. nedoháněj tisíce kroků
    tAcc+=dt;
    let steps=0;
    while(tAcc>=STEP && steps<6){            // dožeň reálný čas, ale max pár kroků na snímek
      tAcc-=STEP; frameCount++;
      // pohupování postaviček zrychluje s tempem hry (stejně jako hudba); fáze se akumuluje, ať se neškube
      bobPhase += 0.09 * (mode==='play' ? 1 + gameSpeedProg()*1.3 : 1);
      pollGamepads();                        // vstup i pohyb do stran (DAS) běží po krocích → konzistentní i při <60 fps
      pollKeyboard();
      pollMenuEgg();                         // herní časovač (držení doprava 5 s)
      if(blinkGroom>0) blinkGroom--;         // mrknutí očí v menu (fps-nezávisle)
      if(blinkBride>0) blinkBride--;
      if(mode==='play') update();
      steps++;
    }
    if(mode!=='menu' && now-lastInputAt>IDLE_MS) idleToMenu();   // dlouhá nečinnost → zpět do menu
    if(mode==='menu') drawMenu();
    else if(mode==='play') drawPlay();
    else if(mode==='over') drawOver();
    // mode==='stats' → statistiky kreslí HTML overlay, canvas nerušíme
  }catch(err){
    if(now-lastFrameErr>2000){ lastFrameErr=now; console.error('Chyba ve smyčce hry (pokračuji dál):', err); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// Poslední záchrana: nezachycené chyby/přísliby jen zaloguj, ať se aplikace nezhroutí.
window.addEventListener('error', e=>{ console.error('Nezachycená chyba:', e.error||e.message); });
window.addEventListener('unhandledrejection', e=>{ console.error('Nezachycený příslib:', e.reason); });

//================= INPUT =================
// DAS pohyb do stran z herní smyčky (1× hned, krátká prodleva, pak rychlé opakování)
const keyHeld = {};
const kbRepeat = { a:{dir:0,timer:0}, b:{dir:0,timer:0} };
function dasMove(st, dir, player){
  if(dir===0){ st.dir=0; st.timer=0; return; }
  if(st.dir!==dir){ move(player,dir); st.dir=dir; st.timer=DAS_DELAY; }
  else if(--st.timer<=0){ move(player,dir); st.timer=DAS_RATE; }
}
function pollKeyboard(){
  if(mode!=='play' || paused || ending || performance.now()<countdownEnd) return;
  const p1=players[0], p2=players[1];
  const pa = p2.ai ? p1 : p2;            // šipky v sólo hře ovládají člověka
  dasMove(kbRepeat.a, (keyHeld['KeyD']?1:0)-(keyHeld['KeyA']?1:0), p1);
  dasMove(kbRepeat.b, (keyHeld['ArrowRight']?1:0)-(keyHeld['ArrowLeft']?1:0), pa);
}

window.addEventListener('keydown', e=>{
  keyHeld[e.code]=true;
  noteInput();                                  // jakákoli klávesa = vstup (reset idle časovače)
  audioInit();                                  // jakákoli klávesa = gesto → rozběhni/obnov zvuk
  if(e.code==='KeyF'){ toggleFull(); e.preventDefault(); return; }
  if(e.code==='KeyM'){ toggleMute(); updateMuteBtn(); return; }   // ztlumit / zapnout zvuk

  if(mode==='menu'){
    if(e.code==='Tab'){ e.preventDefault(); openStats(); return; }   // Tab = statistiky
    if(flipMode) flipDeadline=performance.now()+10000;   // vstup v menu → odlož narovnání obrazu
    // mrknutí očí podle toho, čí klávesa se stiskla (WASD = ženich, šipky = nevěsta)
    if(e.code[0]==='K' && 'KeyW KeyA KeyS KeyD'.includes(e.code)) blinkGroom=BLINK_FRAMES;
    else if(e.code.startsWith('Arrow')) blinkBride=BLINK_FRAMES;
    const prevAI=pendingAI, prevLevel=level;
    if(e.code==='KeyW'||e.code==='ArrowUp'){
      if(pendingAI===false){ if(!e.repeat && ++maxUpPresses>=5) toggleSwap(); }   // už nahoře → 5× nahoru = přepni swap egg
      else { pendingAI=false; maxUpPresses=0; }
      maxDownPresses=0;
    }
    else if(e.code==='KeyS'||e.code==='ArrowDown'){
      if(pendingAI===true){ if(!e.repeat && ++maxDownPresses>=5) flipScreen(); }   // už dole → 5× dolů = otoč obraz
      else { pendingAI=true; maxDownPresses=0; }
      maxUpPresses=0;
    }
    else if(e.code==='KeyA'||e.code==='ArrowLeft'){
      if(level<=minLevel()){ if(!e.repeat && ++maxLeftPresses>=5) unlockZero(); }   // už dole → 5× doleva = nultá úroveň
      else { level=Math.max(minLevel(),level-1); maxLeftPresses=0; }
      maxRightPresses=0;
    }
    else if(e.code==='KeyD'||e.code==='ArrowRight'){
      if(level>=maxLevel()){ if(!e.repeat && ++maxRightPresses>=5){ maxRightPresses=0; if(!hardcoreUnlocked) unlockHardcore(); else if(!superUnlocked) unlockSuper(); } }  // 5× doprava: hardcore → super-hardcore
      else { level=Math.min(maxLevel(),level+1); maxRightPresses=0; }
      maxLeftPresses=0;
    }
    else if(e.code==='Enter'||e.code==='NumpadEnter'||e.code==='Space') startGame(pendingAI);
    if(pendingAI!==prevAI || level!==prevLevel) Snd.menu();   // změna nastavení = cvaknutí
    return;
  }
  if(mode==='over'){
    if(e.code==='Enter'||e.code==='NumpadEnter'||e.code==='Space'){ stopAllSound(); swapMode=false; unflip(); mode='menu'; }   // ukonči znělku + zruš eastereggy
    return;
  }
  if(mode==='stats'){
    if(e.code==='ArrowRight'||e.code==='KeyD') statsNext();
    else if(e.code==='ArrowLeft'||e.code==='KeyA') statsPrev();
    else if(e.code==='ArrowUp'||e.code==='KeyW') statsScroll(-40);
    else if(e.code==='ArrowDown'||e.code==='KeyS') statsScroll(40);
    else if(e.code==='Escape'||e.code==='Enter'||e.code==='NumpadEnter'||e.code==='Space'||e.code==='Tab'){ e.preventDefault(); closeStats(); }
    return;
  }
  // play
  if(ending) return;
  if(e.code==='KeyP'){ togglePause(); return; }
  if(paused){
    if(e.code==='KeyQ'||e.code==='Escape') quitToMenu();   // ukončit hru → zpět do menu
    return;
  }
  const p1=players[0], p2=players[1];
  const pa = p2.ai ? p1 : p2;   // šipky: v sólo hře ovládají člověka (p1)
  // soft drop (dolů) se čte průběžně z držené klávesy v updatePlayer; tady jen otočení + zákaz scrollu
  switch(e.code){              // pohyb do stran řeší pollKeyboard (DAS)
    case 'KeyW': if(!e.repeat) rotate(p1,-1); break;   // nahoru = po směru hodinových ručiček
    case 'ArrowUp':    if(!e.repeat) rotate(pa,-1); e.preventDefault(); break;   // nahoru = po směru hodinových ručiček
    case 'ArrowDown': case 'ArrowLeft': case 'ArrowRight': e.preventDefault(); break;
  }
});
window.addEventListener('keyup', e=>{ keyHeld[e.code]=false; });   // soft drop se čte z keyHeld v updatePlayer

//================= USB OVLADAČE (Gamepad API) =================
// Ovladač 0 -> Ženich, ovladač 1 -> Nevěsta. Klávesy WASD/šipky fungují dál.
const padPrev = {};      // index -> minulý stav (pro detekci stisku)
const padRepeat = {};    // index -> {dir,timer} pro plynulé držení doleva/doprava
const playerPads = [];   // pIdx (0=ženich,1=nevěsta) -> slot ovladače (naplní pollGamepads)
// vibrace ovladače daného hráče — jen pokud to ovladač/prohlížeč podporuje (jinak potichu nic)
function rumble(pIdx, {strong=0.5, weak=0.5, dur=120}={}){
  const slot = playerPads[pIdx];
  if(slot==null) return;
  const gp = (navigator.getGamepads ? navigator.getGamepads() : [])[slot];
  if(!gp) return;
  try{
    if(gp.vibrationActuator && gp.vibrationActuator.playEffect){
      gp.vibrationActuator.playEffect('dual-rumble', {startDelay:0, duration:dur, strongMagnitude:strong, weakMagnitude:weak});
    } else if(gp.hapticActuators && gp.hapticActuators[0] && gp.hapticActuators[0].pulse){
      gp.hapticActuators[0].pulse(Math.max(strong,weak), dur);
    }
  }catch(e){}
}
function readPad(gp){
  const b = i => gp.buttons[i] && gp.buttons[i].pressed;
  const ax = gp.axes || [];
  const lx = ax[0]||0, ly = ax[1]||0;
  const up=b(12)||ly<-0.5, down=b(13)||ly>0.5, left=b(14)||lx<-0.5, right=b(15)||lx>0.5;
  // Přední 4 tlačítka (diamant vpravo). Ve standard mappingu Gamepad API:
  //   0 = A (dole), 1 = B (vpravo), 2 = X (vlevo), 3 = Y (nahoře).
  // Úhlopříčné dvojice se točí stejně: A+Y po směru, B+X proti směru.
  return {
    up, down, left, right,
    rotCW:  b(0)||b(3)||up,                 // A + Y + křížek nahoru = po směru hodinových ručiček
    rotCCW: b(1)||b(2),                     // B + X = proti směru
    confirm: b(0)||b(9),                    // A nebo Start
    start:   b(9),                          // Start = pauza
    back:    b(8),                          // Select/Back = ukončit hru (z pauzy)
    mute:    b(4)||b(5),                    // horní tlačítka L1/R1 = ztlumit zvuk (hra je jinde nepoužívá)
  };
}
function pollGamepads(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  anyPad = false; for(let i=0;i<pads.length;i++) if(pads[i]){ anyPad=true; break; }   // připojen aspoň jeden ovladač?
  menuPadRight = false;                           // přepočítá se níže (drží se doprava na ovladači?)
  let order = 0;                                 // pořadí připojeného ovladače → hráč (0=ženich, 1=nevěsta)
  for(let i=0;i<pads.length;i++){
    const gp = pads[i]; if(!gp) continue;
    // Stav vážeme na fyzický slot (gp.index), hráče ale přiřazujeme podle pořadí připojení,
    // protože ovladače nemusí sedět ve slotech 0,1 (mezery / vyšší index → dřív selhal pohyb).
    const slot = (gp.index!=null) ? gp.index : i;
    const pIdx = order++;
    playerPads[pIdx] = slot;                       // zapamatuj ovladač pro vibrace tohoto hráče
    const cur = readPad(gp), prev = padPrev[slot] || {};
    const hit = k => cur[k] && !prev[k];
    if(cur.up||cur.down||cur.left||cur.right||cur.confirm||cur.start||cur.back||cur.rotCW||cur.rotCCW||cur.mute) noteInput();   // aktivita na ovladači = vstup (reset idle časovače)

    if(hit('confirm')||hit('start')) audioInit();   // gesto na ovladači → rozběhni zvuk
    if(mode==='menu' && hit('mute')){ audioInit(); toggleMute(); updateMuteBtn(); }   // L1/R1 = ztlumit (jen v menu)
    if(mode==='menu'){
      // skryté kombo: drž Select a 5× po sobě zmáčkni Start → statistiky (aby to nikdo neudělal omylem)
      if(cur.back && hit('start')){
        audioInit();
        if(++statsComboPresses>=5){ statsComboPresses=0; openStats(); }
        else Snd.menu();                                 // cvaknutí 1..4 = host slyší, že se počítá
        padPrev[slot]=cur; continue;                     // Start přitom nespustí hru
      }
      if(!cur.back && prev.back) statsComboPresses=0;     // uvolnění Selectu = reset (musí být 5× vcelku)
      // mrknutí očí: 1. připojený ovladač = ženich, 2. = nevěsta (poznat, kdo koho ovládá)
      const anyHit = hit('up')||hit('down')||hit('left')||hit('right')||hit('confirm')||hit('start')||hit('rotCW')||hit('rotCCW')||hit('back');
      if(anyHit){
        if(pIdx===0) blinkGroom=BLINK_FRAMES; else if(pIdx===1) blinkBride=BLINK_FRAMES;
        if(flipMode) flipDeadline=performance.now()+10000;   // vstup v menu → odlož narovnání obrazu
      }
      const prevAI=pendingAI, prevLevel=level;
      if(hit('up')){
        if(pendingAI===false){ if(++maxUpPresses>=5) toggleSwap(); }   // už nahoře → 5× nahoru = přepni swap egg
        else { pendingAI=false; maxUpPresses=0; }
        maxDownPresses=0;
      } else if(hit('down')){
        if(pendingAI===true){ if(++maxDownPresses>=5) flipScreen(); }   // už dole → 5× dolů = otoč obraz
        else { pendingAI=true; maxDownPresses=0; }
        maxUpPresses=0;
      }
      if(hit('left')){
        if(level<=minLevel()){ if(++maxLeftPresses>=5) unlockZero(); }   // už dole → 5× doleva = nultá úroveň
        else { level = Math.max(minLevel(),level-1); maxLeftPresses=0; }
        maxRightPresses=0;
      }
      else if(hit('right')){
        if(level>=maxLevel()){ if(++maxRightPresses>=5){ maxRightPresses=0; if(!hardcoreUnlocked) unlockHardcore(); else if(!superUnlocked) unlockSuper(); } }   // 5× doprava: hardcore → super-hardcore
        else { level = Math.min(maxLevel(),level+1); maxRightPresses=0; }
        maxLeftPresses=0;
      }
      if(cur.right) menuPadRight = true;          // pro odemčení držením doprava > 5 s
      if(pendingAI!==prevAI || level!==prevLevel){ audioInit(); Snd.menu(); }   // změna nastavení = cvaknutí
      if(hit('confirm')) startGame(pendingAI);
    } else if(mode==='over'){
      if(hit('confirm')){ stopAllSound(); swapMode=false; unflip(); mode='menu'; }   // ukonči znělku + zruš eastereggy
    } else if(mode==='stats'){
      if(hit('confirm')||hit('start')||hit('back')) closeStats();   // A / Start / Select = zpět do hry
      else if(hit('right')) statsNext();                            // starší den
      else if(hit('left'))  statsPrev();                            // novější den
      if(cur.up) statsScroll(-14); if(cur.down) statsScroll(14);    // držení = plynulé rolování
    } else if(mode==='play' && !ending){
      if(hit('start')) togglePause();
      if(paused){ if(hit('back')) quitToMenu(); padPrev[slot]=cur; continue; }   // v pauze: Select = konec
      let p = players[pIdx];
      if(p && p.ai) p = players.find(x=>!x.ai);   // sólo: libovolný ovladač ovládá člověka
      if(!paused && p && !p.ai){
        if(hit('rotCW'))  rotate(p, -1);   // A / Y / nahoru → po směru hodinových ručiček
        if(hit('rotCCW')) rotate(p, 1);    // B / X → proti směru
        p.padDrop = cur.down;              // soft drop = drží se dolů (funguje průběžně; grace po spawnu řeší updatePlayer)
        const dir = cur.left ? -1 : cur.right ? 1 : 0;
        const rep = padRepeat[slot] || {dir:0,timer:0};
        if(dir!==0){
          if(rep.dir!==dir){ move(p,dir); rep.dir=dir; rep.timer=DAS_DELAY; }   // 1× hned + prodleva
          else if(--rep.timer<=0){ move(p,dir); rep.timer=DAS_RATE; }           // rychlé opakování
        } else { rep.dir=0; rep.timer=0; }
        padRepeat[slot] = rep;
      }
    }
    padPrev[slot] = cur;
  }
}
let padDropped = false;   // odpojil se ovladač během hry? → hláška na pauze
window.addEventListener('gamepadconnected', ()=>{ padDropped=false; });   // zase připojen → hláška zmizí
// Odpojení ovladače uprostřed hry (vybitá baterka, vytažený kabel) → automaticky pauza,
// ať hráč nepřijde o rozehraný duel a ví, co se stalo.
window.addEventListener('gamepaddisconnected', ()=>{
  if(mode==='play' && !ending && !paused){ padDropped=true; pauseGame(); }
});

//================= FULLSCREEN =================
function toggleFull(){
  const tv=document.getElementById('tv');
  if(!document.fullscreenElement){
    (tv.requestFullscreen||tv.webkitRequestFullscreen).call(tv);
  } else {
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  }
}
// Ve fullscreenu / ?tv režimu slaď pozadí okolo herní plochy s jejím gradientem,
// aby na jiném poměru stran nevznikl ostrý předěl: nad plochou plná světlá, pod
// plochou plná tmavá, uvnitř stejný přechod jako v canvasu (#1a2140 → #0a0d1c).
function fitBackground(){
  const tv=document.getElementById('tv');
  const inTV = document.body.classList.contains('tvmode');
  const inFS = !!(document.fullscreenElement||document.webkitFullscreenElement);
  if(!inTV && !inFS){ tv.style.background=''; document.body.style.background=''; return; }   // normální režim → nech skříň
  const sc=document.querySelector('.screen').getBoundingClientRect();
  const top=Math.max(0,Math.round(sc.top)), bot=Math.round(sc.bottom);
  const bg='linear-gradient(to bottom, #1a2140 0px, #1a2140 '+top+'px, #0a0d1c '+bot+'px, #0a0d1c 100%)';
  tv.style.background=bg;
  document.body.style.background=bg;
}
window.addEventListener('resize', fitBackground);
window.addEventListener('load', fitBackground);
document.addEventListener('fullscreenchange', fitBackground);
document.addEventListener('webkitfullscreenchange', fitBackground);
document.getElementById('btnFull').addEventListener('click', ()=>{ audioInit(); toggleFull(); });
document.getElementById('btnStart').addEventListener('click', ()=>{
  audioInit();
  if(mode==='menu') startGame(pendingAI); else { musicStop(); stopAllSound(); swapMode=false; unflip(); mode='menu'; }
});
document.getElementById('btnStats').addEventListener('click', ()=>{
  audioInit();
  if(mode==='stats') closeStats(); else openStats();
});
const btnMute = document.getElementById('btnMute');
function updateMuteBtn(){ btnMute.classList.toggle('muted', muted); }
updateMuteBtn();
btnMute.addEventListener('click', ()=>{ audioInit(); toggleMute(); updateMuteBtn(); });

// zapínací CRT overlay po doběhnutí schovej (+ pojistka, ať hru nikdy trvale nezakryje)
(function(){
  const el=document.querySelector('.crton'); if(!el) return;
  const hide=()=>{ el.style.display='none'; };
  el.addEventListener('animationend', hide);
  setTimeout(hide, 1400);
})();

//================= INSTALACE (PWA) =================
// Tlačítko „instalovat" ukaž jen když prohlížeč instalaci nabízí (Chromium přes http(s)/localhost).
// Přes file:// ani v prohlížečích bez podpory se tlačítko neukáže (zůstane skryté).
let deferredInstall = null;
const btnInstall = document.getElementById('btnInstall');
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();               // nech si vlastní tlačítko místo lišty prohlížeče
  deferredInstall = e;
  btnInstall.hidden = false;
});
btnInstall.addEventListener('click', async ()=>{
  if(!deferredInstall) return;
  deferredInstall.prompt();
  try{ await deferredInstall.userChoice; }catch(e){}
  deferredInstall = null;
  btnInstall.hidden = true;         // instalační výzvu lze použít jen jednou
});
window.addEventListener('appinstalled', ()=>{ deferredInstall=null; btnInstall.hidden=true; });

//================= STATISTIKY (localStorage) =================
// localStorage funguje spolehlivě i přes file:// (na rozdíl od IndexedDB).
// Záznamy jsou drobné, takže limit ~5 MB stačí na desítky tisíc her.
const STORE_KEY='drwedding-games';
function loadGames(){
  try{ const v=JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); return Array.isArray(v)?v:[]; }
  catch(e){ console.warn('Statistiky se nepodařilo načíst:',e); return []; }
}
function saveGame(rec){
  try{
    const all=loadGames();
    all.push(rec);
    localStorage.setItem(STORE_KEY, JSON.stringify(all));
  }catch(e){ console.warn('Statistiku se nepodařilo uložit:',e); }
}
// Statistiky lze zobrazit jako overlay přímo ve hře (kiosk / ovladače) i na samostatné
// stránce stats.html — obojí vykresluje sdílený statsview.js.
let statsCtl = null;
const statsOverlay = document.getElementById('statsOverlay');
function openStats(){
  if(mode!=='menu') return;                 // otevírá se jen z menu
  statsCtl = StatsView.mount(document.getElementById('statsInner'), {standalone:false});   // čerstvě z localStorage
  statsOverlay.classList.add('open'); statsOverlay.scrollTop=0;
  mode='stats'; audioInit(); Snd.menu();
}
function closeStats(){
  statsOverlay.classList.remove('open'); statsCtl=null;
  mode='menu'; Snd.menu();
}
function statsNext(){ if(statsCtl) statsCtl.next(); }      // ← na obrazovce „Starší ›" (starší den)
function statsPrev(){ if(statsCtl) statsCtl.prev(); }      // ← „‹ Novější" (novější den)
function statsScroll(dy){ statsOverlay.scrollTop += dy; }

//================= OFFLINE (service worker) =================
// Registrace SW pro offline provoz (network first, cache fallback). Funguje jen přes http(s).
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
