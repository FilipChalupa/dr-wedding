<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dr. Wedding</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    height:100%; width:100%;
    background:#06060a;
    background:radial-gradient(circle at 50% 35%, #15151f 0%, #08080c 60%, #000 100%);
    overflow:hidden;
    font-family:'Courier New',monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#cdc8dd; user-select:none; -webkit-user-select:none;
  }

  /* ---- the TV cabinet ---- */
  .tv {
    position:relative;
    padding:3.2vh 3.4vh 5.5vh 3.4vh;
    border-radius:2.2vh;
    background:linear-gradient(160deg,#5a4632 0%,#3a2c1d 35%,#241a11 100%);
    box-shadow:
      inset 0 0 2px rgba(255,220,180,.25),
      inset 0 6px 14px rgba(0,0,0,.55),
      0 14px 40px rgba(0,0,0,.8),
      0 2px 0 rgba(255,255,255,.05);
    border:2px solid #1a120a;
  }
  .tv::before { /* speaker / detail strip */
    content:""; position:absolute; right:3.4vh; bottom:1.1vh;
    width:5vh; height:2.6vh; border-radius:3px;
    background:repeating-linear-gradient(90deg,#1a120a 0 2px,#3a2c1d 2px 4px);
    box-shadow:inset 0 0 3px #000;
  }
  .brand {
    position:absolute; left:3.6vh; bottom:1.4vh;
    font-size:1.7vh; letter-spacing:.25vh; font-weight:bold;
    color:#e7c98c; text-shadow:0 1px 0 #000; font-style:italic;
  }
  .led {
    position:absolute; left:50%; transform:translateX(-50%); bottom:1.9vh;
    width:1vh; height:1vh; border-radius:50%;
    background:#ff5d5d; box-shadow:0 0 6px 2px rgba(255,80,80,.8);
    animation:pulse 2.4s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }

  /* ---- the screen ---- */
  .screen {
    position:relative;
    width:min(86vw, 116vh);
    aspect-ratio:4/3;
    background:#000;
    border-radius:6% / 8%;
    overflow:hidden;
    box-shadow:
      inset 0 0 7vh rgba(0,0,0,.95),
      inset 0 0 1.5vh rgba(0,0,0,1),
      0 0 0 1.2vh #0c0c0c,
      0 0 0 1.6vh #2a2a2a;
  }
  canvas {
    position:absolute; inset:0;
    width:100%; height:100%;
    image-rendering:pixelated; image-rendering:crisp-edges;
    /* gentle CRT bulge */
    transform:scale(1.012);
  }
  .scanlines {
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px,
      rgba(0,0,0,.22) 2px, rgba(0,0,0,.22) 3px);
    mix-blend-mode:multiply;
  }
  .glow {
    position:absolute; inset:0; pointer-events:none; z-index:6;
    background:
      radial-gradient(circle at 50% 42%, rgba(120,160,255,.06), transparent 60%),
      radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  .flicker {
    position:absolute; inset:0; pointer-events:none; z-index:7;
    background:rgba(180,200,255,.025);
    animation:flick .12s steps(2) infinite;
  }
  @keyframes flick { 0%{opacity:.5} 50%{opacity:.9} 100%{opacity:.4} }

  .controls {
    margin-top:2.4vh; display:flex; gap:1.4vh; z-index:20;
  }
  .controls button {
    font-family:inherit; font-size:1.7vh; font-weight:bold;
    padding:.9vh 1.8vh; border-radius:1vh; cursor:pointer;
    color:#1a120a; border:2px solid #1a120a;
    background:linear-gradient(#f0d79a,#c9a85e);
    box-shadow:0 2px 0 #1a120a; letter-spacing:.1vh;
  }
  .controls button:active { transform:translateY(2px); box-shadow:none; }

  :fullscreen.tv, :-webkit-full-screen.tv {
    width:100vw; height:100vh; border-radius:0;
    display:flex; align-items:center; justify-content:center;
    padding:0; background:#000;
  }
  :fullscreen.tv .screen, :-webkit-full-screen.tv .screen {
    width:min(100vw,133.333vh); height:auto;
    border-radius:0; box-shadow:inset 0 0 9vh rgba(0,0,0,.95);
  }
  :fullscreen.tv .brand, :fullscreen.tv .led, :fullscreen.tv::before { display:none; }

  /* ---- ?tv : kiosk režim pro fyzickou televizi (skryje skříň + tlačítka) ---- */
  body.tvmode { background:#000; }
  body.tvmode .controls { display:none; }
  body.tvmode .tv {
    width:100vw; height:100vh; padding:0; border:0; border-radius:0;
    background:#000; box-shadow:none;
    display:flex; align-items:center; justify-content:center;
  }
  body.tvmode .tv::before, body.tvmode .brand, body.tvmode .led { display:none; }
  body.tvmode .screen {
    width:min(100vw,133.333vh); height:auto;
    border-radius:0;
    box-shadow:inset 0 0 9vh rgba(0,0,0,.95), inset 0 0 1.5vh rgba(0,0,0,1);
  }

  /* ---- stránka statistik (?stats) ---- */
  body.statspage { overflow:auto; height:auto; align-items:flex-start; }
  body.statspage .tv, body.statspage .controls { display:none; }
  .stats { display:none; width:min(96vw,860px); margin:0 auto; padding:4vh 2vh 6vh; }
  body.statspage .stats { display:block; }
  .stats h1 { color:#f8d77e; font-size:clamp(20px,3.4vh,34px); letter-spacing:.25vh;
    text-align:center; font-style:italic; text-shadow:0 2px 0 #000; }
  .stats h1 small { display:block; font-style:normal; font-size:1.5vh; letter-spacing:.4vh;
    color:#cba6ec; margin-top:.6vh; }
  .stats .nav { display:flex; align-items:center; justify-content:center; gap:1.6vh; margin:3vh 0 1vh; }
  .stats button { font-family:inherit; font-size:1.7vh; font-weight:bold;
    padding:.8vh 1.6vh; border-radius:1vh; cursor:pointer; color:#1a120a;
    border:2px solid #1a120a; background:linear-gradient(#f0d79a,#c9a85e); box-shadow:0 2px 0 #1a120a; }
  .stats button:active { transform:translateY(2px); box-shadow:none; }
  .stats button:disabled { opacity:.3; cursor:default; box-shadow:0 2px 0 #1a120a; transform:none; }
  .stats .day { color:#cba6ec; font-size:2vh; text-align:center; font-weight:bold; min-width:30vw; }
  .stats .pageno { text-align:center; color:#6f6a8a; font-size:1.4vh; margin-bottom:2.4vh; }
  .stats .sum { text-align:center; color:#9a95ad; font-size:1.6vh; margin-bottom:2.6vh; line-height:1.7; }
  .stats .sum b { color:#e7e0ff; }
  .stats table { width:100%; border-collapse:collapse; font-size:1.7vh; }
  .stats th, .stats td { padding:1vh .8vh; border-bottom:1px solid rgba(255,255,255,.08); text-align:left; }
  .stats th { color:#f8a8c4; text-transform:uppercase; font-size:1.3vh; letter-spacing:.1vh; }
  .stats td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .stats .win-L { color:#cba6ec; font-weight:bold; }
  .stats .win-R { color:#f8a8c4; font-weight:bold; }
  .stats .empty { text-align:center; color:#9a95ad; margin:8vh 0; font-size:1.9vh; }
  .stats .back { display:block; text-align:center; margin-top:3.5vh; }
  .stats .back a { color:#7fd0ff; text-decoration:none; font-size:1.7vh; }
  .stats .back a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="tv" id="tv">
    <div class="screen">
      <canvas id="game" width="720" height="576"></canvas>
      <div class="scanlines"></div>
      <div class="glow"></div>
      <div class="flicker"></div>
    </div>
    <div class="brand">WEDDITRON&nbsp;//&nbsp;MODEL&nbsp;DW-1</div>
    <div class="led"></div>
  </div>
  <div class="controls">
    <button id="btnStart">▶ START</button>
    <button id="btnFull">⛶ FULLSCREEN</button>
    <button id="btnStats">📊 STATISTIKY</button>
  </div>

  <div class="stats" id="stats"></div>

<script>
//================= SETUP =================
// ?tv -> kiosk režim pro fyzickou televizi (bez skříně a tlačítek)
if(new URLSearchParams(location.search).has('tv')) document.body.classList.add('tvmode');
// ?stats -> stránka se statistikami (DOM, ne herní plátno)
const STATS_MODE = new URLSearchParams(location.search).has('stats');

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
// Vnitřní souřadnice zůstávají 320×240, ale renderuje se do PAL bufferu 720×576.
const W = 320, H = 240;
ctx.scale(cv.width/W, cv.height/H);

const COLS = 8, ROWS = 16, CELL = 10;          // jako originální Dr. Mario
const LX0 = 70, RX0 = 170, BY = 46;            // board top-left positions
const BW = COLS*CELL, BH = ROWS*CELL;

const COLORS = ['P','G','R'];
const PAL = {                                // originální Dr. Mario barvy
  P:{c:'#4f7be8',l:'#a6c0f4',d:'#2a4496'},   // modrá
  G:{c:'#f0c83a',l:'#f8e07e',d:'#aa8512'},   // žlutá
  R:{c:'#e84b4b',l:'#f3a0a0',d:'#9e2222'},   // červená
};
const DIR = {U:[-1,0],D:[1,0],L:[0,-1],R:[0,1]};
const OPP = {U:'D',D:'U',L:'R',R:'L'};
const OFF = {0:[0,1],1:[-1,0],2:[0,-1],3:[1,0]};     // orient -> second-cell offset
const ODIR = {0:'R',1:'U',2:'L',3:'D'};               // orient -> pivot partner dir

const I = (r,c)=> r*COLS+c;

//================= GAME STATE =================
let mode = 'menu';        // 'menu' | 'play' | 'over'
let players = [];
let winner = null;
let pendingAI = false;    // false = 2 hráči, true = vs počítač
let frameCount = 0;
let level = 3;                          // 1..5 -> počet starostí
let countdownEnd = 0;                   // čas (ms) konce odpočtu 3·2·1
let gameStart = 0;                      // čas (ms) začátku hraní (po odpočtu)
let gameStartWall = 0;                  // reálný čas (Date.now) začátku hry — pro statistiky
let gameLogged = false;                 // zda už byla dohraná hra zapsána do statistik
let paused = false;
let ending = false;                     // krátké zamrznutí po dohrání
let freezeEnd = 0;                      // čas (ms) konce zamrznutí
const FREEZE_MS = 900;
const CLEAR_FRAMES = 28;                // jak dlouho je vidět outline po zmizení
const DAS_DELAY = 26, DAS_RATE = 9;    // posun do stran: 1× hned, prodleva, pak opakování
const VIRUS_LEVELS = [8,12,16,22,30];   // počet starostí pro úrovně 1..5
const COUNTDOWN_MS = 2500;              // 3 (0,5 s) + 2 (1 s) + 1 (1 s)
// pád kapsle: snímků na jedno políčko — start pomalý, postupně zrychluje
// DROP_GRACE = úvodní vteřiny bez zrychlování (aby hra nezrychlila moc brzy)
const DROP_START = 95, DROP_MIN = 22, DROP_RAMP = 0.5, DROP_GRACE = 25;

function randColor(){ return COLORS[(Math.random()*3)|0]; }
function randPill(){ return {ca:randColor(), cb:randColor()}; }

function newPlayer(side){
  return {
    side,                       // 'L' groom, 'R' bride
    grid:new Array(COLS*ROWS).fill(null),
    pill:null, next:randPill(),
    dropTimer:0, softDrop:false,
    virusCount:0, pendingGarbage:[],
    busy:false, phase:'settle', phaseTimer:0, chains:0, gainCells:0, gainVir:0, gainGarbage:[],
    flashes:[], comboTimer:0, comboN:0, animClear:0, celebrate:0,
    score:0,
    ai:false, aiPlan:null, aiTimer:0,
  };
}

function other(p){ return players[0]===p ? players[1] : players[0]; }

//================= BOARD LOGIC =================
// pill.r = spodní řada, pill.c = levý sloupec. Spodek zůstává na místě:
// vodorovná poloha je vždy v řadě r, svislá poloha roste nahoru (r, r-1).
// Svislé orientace střídají pravý / levý sloupec (pohyb do boků).
function cellsOf(pill){
  const {r,c,orient,ca,cb}=pill;
  switch(orient){
    case 0:  return [{r,     c,     color:ca, partner:'R'}, {r,     c:c+1, color:cb, partner:'L'}]; // vodorovně
    case 1:  return [{r,     c:c+1, color:ca, partner:'U'}, {r:r-1, c:c+1, color:cb, partner:'D'}]; // svisle vpravo: ca dole
    case 2:  return [{r,     c:c+1, color:ca, partner:'L'}, {r,     c,     color:cb, partner:'R'}]; // vodorovně (prohozené)
    default: return [{r:r-1, c,     color:ca, partner:'D'}, {r,     c,     color:cb, partner:'U'}]; // svisle vlevo: ca nahoře
  }
}
function canPlace(g, pill){
  for(const cl of cellsOf(pill)){
    if(cl.c<0 || cl.c>=COLS) return false;
    if(cl.r>=ROWS) return false;
    if(cl.r>=0 && g[I(cl.r,cl.c)]) return false;
  }
  return true;
}
function placeInto(g, pill){
  for(const cl of cellsOf(pill)){
    if(cl.r>=0) g[I(cl.r,cl.c)] = {color:cl.color, kind:'pill', partner:cl.partner};
  }
}
function countViruses(g){ let n=0; for(const c of g) if(c&&c.kind==='virus') n++; return n; }

function findClears(g){
  const mark = new Set(), runs = [];   // runs = barvy jednotlivých zničených řad/sloupců
  for(let r=0;r<ROWS;r++){
    let run=1;
    for(let c=1;c<=COLS;c++){
      const a = c<COLS ? g[I(r,c)] : null, b = g[I(r,c-1)];
      if(a&&b&&a.color===b.color) run++;
      else { if(run>=4){ for(let k=c-run;k<c;k++) mark.add(I(r,k)); runs.push(b.color); } run=1; }
    }
  }
  for(let c=0;c<COLS;c++){
    let run=1;
    for(let r=1;r<=ROWS;r++){
      const a = r<ROWS ? g[I(r,c)] : null, b = g[I(r-1,c)];
      if(a&&b&&a.color===b.color) run++;
      else { if(run>=4){ for(let k=r-run;k<r;k++) mark.add(I(k,c)); runs.push(b.color); } run=1; }
    }
  }
  return {mark, runs};
}
function clearMarked(g, mark){
  let virus=0;
  mark.forEach(idx=>{
    const cell = g[idx]; if(!cell) return;
    if(cell.partner){
      const [dr,dc] = DIR[cell.partner];
      const r=(idx/COLS)|0, c=idx%COLS, nr=r+dr, nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){
        const nb=g[I(nr,nc)];
        if(nb && nb.partner===OPP[cell.partner]) nb.partner=null;
      }
    }
    if(cell.kind==='virus') virus++;
    g[idx]=null;
  });
  return virus;
}
// jeden krok gravitace (spadnutí o 1 řádek), vrací true pokud se něco pohnulo
function gravityStep(g){
  const visited=new Array(g.length).fill(false);
  const groups=[];
  for(let r=ROWS-1;r>=0;r--) for(let c=0;c<COLS;c++){
    const i=I(r,c), cell=g[i];
    if(cell && cell.kind==='pill' && !visited[i]){
      const grp=[{r,c,i}]; visited[i]=true;
      if(cell.partner){
        const [dr,dc]=DIR[cell.partner], nr=r+dr, nc=c+dc;
        if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){
          const ni=I(nr,nc);
          if(g[ni]&&g[ni].kind==='pill'&&!visited[ni]){ grp.push({r:nr,c:nc,i:ni}); visited[ni]=true; }
        }
      }
      groups.push(grp);
    }
  }
  const movers=[];
  for(const grp of groups){
    let canFall=true;
    for(const cl of grp){
      const br=cl.r+1;
      if(br>=ROWS){ canFall=false; break; }
      const bi=I(br,cl.c);
      if(g[bi] && !grp.some(x=>x.i===bi)){ canFall=false; break; }
    }
    if(canFall) for(const cl of grp) movers.push({obj:g[cl.i], from:cl.i, to:I(cl.r+1,cl.c)});
  }
  if(movers.length){
    for(const m of movers) g[m.from]=null;
    for(const m of movers) g[m.to]=m.obj;
    return true;
  }
  return false;
}
function gravity(g){ while(gravityStep(g)){} }   // okamžitá gravitace (pro AI)
// může vůbec něco spadnout? (bez mutace mřížky)
function anyCanFall(g){
  const visited=new Array(g.length).fill(false);
  for(let r=ROWS-1;r>=0;r--) for(let c=0;c<COLS;c++){
    const i=I(r,c), cell=g[i];
    if(cell && cell.kind==='pill' && !visited[i]){
      const grp=[{r,c}]; visited[i]=true;
      if(cell.partner){
        const [dr,dc]=DIR[cell.partner], nr=r+dr, nc=c+dc;
        if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){ const ni=I(nr,nc); if(g[ni]&&g[ni].kind==='pill'&&!visited[ni]){ grp.push({r:nr,c:nc}); visited[ni]=true; } }
      }
      let canFall=true;
      for(const cl of grp){ const br=cl.r+1; if(br>=ROWS){canFall=false;break;} const bi=I(br,cl.c); if(g[bi]&&!grp.some(x=>x.r===br&&x.c===cl.c)){canFall=false;break;} }
      if(canFall) return true;
    }
  }
  return false;
}
function resolveFull(g){
  gravity(g);
  let totalVirus=0, cells=0, chains=0; const cleared=[];
  while(true){
    const {mark}=findClears(g);
    if(mark.size===0) break;
    chains++; cells+=mark.size;
    mark.forEach(idx=> cleared.push({r:(idx/COLS)|0, c:idx%COLS}));
    totalVirus += clearMarked(g, mark);
    gravity(g);
  }
  return {totalVirus, cells, chains, cleared};
}

function countSame(g,r,c,dr,dc,color){
  let n=0,rr=r+dr,cc=c+dc;
  while(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&g[I(rr,cc)]&&g[I(rr,cc)].color===color){ n++; rr+=dr; cc+=dc; }
  return n;
}
function spawnViruses(g,n){
  let placed=0, att=0;
  while(placed<n && att<4000){
    att++;
    const r = 5 + ((Math.random()*(ROWS-5))|0);
    const c = (Math.random()*COLS)|0;
    const i = I(r,c); if(g[i]) continue;
    const color = randColor();
    if(countSame(g,r,c,0,-1,color)+countSame(g,r,c,0,1,color) >= 2) continue;
    if(countSame(g,r,c,-1,0,color)+countSame(g,r,c,1,0,color) >= 2) continue;
    g[i] = {color, kind:'virus', partner:null};
    placed++;
  }
}

//================= MOVES =================
function move(p,d){ if(!p.pill) return; const np={...p.pill,c:p.pill.c+d}; if(canPlace(p.grid,np)) p.pill=np; }
function rotate(p){
  if(!p.pill) return;
  const no=(p.pill.orient+1)%4;
  // zkus na místě, pak drobné „kicky" (od stěny / od stropu / od podlahy)
  for(const [dr,dc] of [[0,0],[0,-1],[0,1],[1,0],[1,-1],[1,1],[-1,0]]){
    const np={...p.pill,orient:no,r:p.pill.r+dr,c:p.pill.c+dc};
    if(canPlace(p.grid,np)){ p.pill=np; return; }
  }
}
function lock(p){
  const cells=cellsOf(p.pill);
  if(cells.some(c=>c.r<0)){ endGame(p,'lose'); return; }
  placeInto(p.grid,p.pill);
  p.pill=null;
  startResolve(p);
}
function dropGarbage(p){
  const q=p.pendingGarbage; p.pendingGarbage=[];
  for(const col of q){
    const c=(Math.random()*COLS)|0;
    // polož úplně nahoru (nejvyšší volné políčko) — animovaná gravitace pak nechá spadnout shora
    let r=0;
    while(r<ROWS && p.grid[I(r,c)]) r++;
    if(r>=ROWS) continue;          // sloupec plný
    p.grid[I(r,c)] = {color:col, kind:'pill', partner:null};
  }
}
// krokové (animované) řešení: padání -> outline -> mazání -> padání ...
function startResolve(p){
  p.busy=true; p.phase='settle'; p.phaseTimer=0;
  p.chains=0; p.gainCells=0; p.gainVir=0; p.gainGarbage=[]; p.flashes=[];
}
function resolveStep(p){
  if(p.phase==='settle'){
    if(anyCanFall(p.grid)){
      // padá stejnou rychlostí jako běžná kostička (bez tlačení dolů)
      if(++p.phaseTimer>=dropIntervalNow()){ p.phaseTimer=0; gravityStep(p.grid); }
    } else {
      const {mark,runs}=findClears(p.grid);
      if(mark.size>0){
        p.chains++; p.gainCells+=mark.size;
        p.gainVir += clearMarked(p.grid, mark);     // kousky zmizí hned
        // smetí: každá zničená řada/sloupec pošle soupeři svou barvu jako
        // samostatnou kostičku (víc linií naráz i combo/řetěz = víc smetí)
        for(const col of runs) p.gainGarbage.push(col);
        p.flashes=[]; mark.forEach(i=>p.flashes.push({r:(i/COLS)|0, c:i%COLS}));
        if(p.gainVir>0) p.animClear=26;
        p.phase='clear'; p.phaseTimer=0;            // outline zůstane chvíli viset
      } else {
        finishResolve(p);
      }
    }
  } else { // 'clear' — drž outline, pak zase padej
    if(++p.phaseTimer>=CLEAR_FRAMES){ p.flashes=[]; p.phase='settle'; p.phaseTimer=0; }
  }
}
function finishResolve(p){
  p.busy=false; p.flashes=[];
  if(p.gainGarbage.length){
    const o=other(p);
    for(const col of p.gainGarbage){ if(o.pendingGarbage.length<10) o.pendingGarbage.push(col); }
  }
  if(p.chains>1){ p.comboTimer=46; p.comboN=p.chains; }
  p.score += p.gainCells*10 + p.gainVir*50;
  p.virusCount=countViruses(p.grid);
  if(p.virusCount===0) endGame(p,'win');
}

function endGame(p,res){
  if(ending || mode==='over') return;
  paused=false;
  ending=true;                               // na chvíli zamrzni, pak výherní obrazovka
  freezeEnd=performance.now()+FREEZE_MS;
  winner = (res==='win') ? p : other(p);
  winner.celebrate=0;
  logGame();
}
function logGame(){
  if(gameLogged || !winner) return;
  gameLogged=true;
  const durationMs = Math.max(0, Math.round(performance.now()-gameStart));
  saveGame({
    startedAt: gameStartWall,
    endedAt: Date.now(),
    durationMs,
    level,                              // 1..5
    viruses: VIRUS_LEVELS[level-1],     // počet starostí
    vsAI: !!players[1].ai,
    winner: winner.side,                // 'L' = ženich, 'R' = nevěsta
    scoreL: players[0].score,
    scoreR: players[1].score,
  });
}

//================= AI =================
function gridClone(g){ return g.map(c=> c?{...c}:null); }
function topHeight(g){
  let h=0;
  for(let c=0;c<COLS;c++){ for(let r=0;r<ROWS;r++){ if(g[I(r,c)]){ h=Math.max(h,ROWS-r); break; } } }
  return h;
}
function countHoles(g){
  let holes=0;
  for(let c=0;c<COLS;c++){
    let seen=false;
    for(let r=0;r<ROWS;r++){ if(g[I(r,c)]) seen=true; else if(seen) holes++; }
  }
  return holes;
}
function computeAiPlan(p){
  let best={score:-1e9, col:(COLS/2|0)-1, orient:0};
  for(let o=0;o<4;o++) for(let c=0;c<COLS;c++){
    let pill={r:0,c,orient:o,ca:p.pill.ca,cb:p.pill.cb};
    if(!canPlace(p.grid,pill)) continue;
    while(canPlace(p.grid,{...pill,r:pill.r+1})) pill={...pill,r:pill.r+1};
    if(cellsOf(pill).some(cl=>cl.r<0)) continue;
    const g=gridClone(p.grid);
    placeInto(g,pill);
    const res=resolveFull(g);
    const score = res.totalVirus*1000 + res.cells*8 - topHeight(g)*4 - countHoles(g)*9 + pill.r*2;
    if(score>best.score) best={score,col:c,orient:o};
  }
  return best;
}
function aiThink(p){
  if(!p.pill) return;
  p.softDrop=false;
  if(!p.aiPlan) p.aiPlan=computeAiPlan(p);
  const pl=p.aiPlan;
  if(p.aiTimer>0){ p.aiTimer--; return; }
  p.aiTimer=4;
  if(p.pill.orient!==pl.orient) rotate(p);
  else if(p.pill.c<pl.col) move(p,1);
  else if(p.pill.c>pl.col) move(p,-1);
}

//================= UPDATE =================
function startGame(ai){
  const nv = VIRUS_LEVELS[level-1];
  players=[newPlayer('L'), newPlayer('R')];
  for(const p of players){ spawnViruses(p.grid,nv); p.virusCount=countViruses(p.grid); }
  players[1].ai = ai;
  winner=null;
  paused=false;
  ending=false;
  countdownEnd=performance.now()+COUNTDOWN_MS;
  gameStart=countdownEnd;
  gameStartWall=Date.now()+COUNTDOWN_MS;   // reálný čas, kdy hra po odpočtu začne
  gameLogged=false;
  mode='play';
}
function dropIntervalNow(){
  const sec = Math.max(0, (performance.now()-gameStart)/1000 - DROP_GRACE);
  return Math.max(DROP_MIN, DROP_START - sec*DROP_RAMP);
}
function updatePlayer(p){
  if(mode!=='play') return;
  if(p.busy){ resolveStep(p); return; }      // animace padání / mazání
  if(!p.pill){
    if(p.pendingGarbage.length>0){ dropGarbage(p); startResolve(p); return; }   // smetí spadne animovaně
    p.virusCount=countViruses(p.grid);
    if(p.virusCount===0){ endGame(p,'win'); return; }
    const np=p.next; p.next=randPill();
    p.pill={r:0, c:(COLS/2|0)-1, orient:0, ca:np.ca, cb:np.cb};
    p.aiPlan=null;
    if(!canPlace(p.grid,p.pill)){ p.pill=null; endGame(p,'lose'); return; }
    p.dropTimer=0;
    return;
  }
  if(p.ai) aiThink(p);
  p.dropTimer += p.softDrop ? 7 : 1;
  if(p.dropTimer>=dropIntervalNow()){
    p.dropTimer=0;
    const np={...p.pill,r:p.pill.r+1};
    if(canPlace(p.grid,np)) p.pill=np; else lock(p);
  }
}
function update(){
  if(ending){ if(performance.now()>=freezeEnd){ ending=false; mode='over'; } return; }
  if(performance.now() < countdownEnd) return;
  if(paused) return;
  for(const p of players) updatePlayer(p);
  for(const p of players){
    if(p.comboTimer>0) p.comboTimer--;
    if(p.animClear>0) p.animClear--;
  }
}

//================= RENDER =================
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function T(t,x,y,size,color,align='center',bold=false){
  ctx.font=(bold?'bold ':'')+size+'px "Courier New",monospace';
  ctx.textAlign=align; ctx.textBaseline='alphabetic';
  ctx.fillStyle=color; ctx.fillText(t,x,y);
}
function bgScreen(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a2140'); g.addColorStop(1,'#0a0d1c');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function drawCell(x,y,cell){
  const p=PAL[cell.color];
  if(cell.kind==='virus'){
    ctx.fillStyle=p.d; rr(x+1.5,y+1.5,CELL-3,CELL-3,4); ctx.fill();
    ctx.fillStyle=p.c; rr(x+2.5,y+2.5,CELL-5,CELL-5,3); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.fillRect(x+CELL*0.28,y+CELL*0.36,2,2.4);
    ctx.fillRect(x+CELL*0.58,y+CELL*0.36,2,2.4);
    ctx.fillStyle='#1a0a14';
    ctx.fillRect(x+CELL*0.30,y+CELL*0.44,1.4,1.4);
    ctx.fillRect(x+CELL*0.60,y+CELL*0.44,1.4,1.4);
    ctx.fillStyle='#2a0c1a'; ctx.fillRect(x+CELL*0.34,y+CELL*0.66,CELL*0.34,1.4);
  } else {
    ctx.fillStyle=p.c; rr(x+1,y+1,CELL-2,CELL-2,4); ctx.fill();
    // silný spoj směrem k partnerovi (jasně ukazuje, které kousky drží spolu)
    if(cell.partner){
      const T=CELL*0.62, O=(CELL-T)/2;
      if(cell.partner==='R') ctx.fillRect(x+CELL*0.5, y+O, CELL*0.5+0.5, T);
      else if(cell.partner==='L') ctx.fillRect(x-0.5, y+O, CELL*0.5+0.5, T);
      else if(cell.partner==='D') ctx.fillRect(x+O, y+CELL*0.5, T, CELL*0.5+0.5);
      else if(cell.partner==='U') ctx.fillRect(x+O, y-0.5, T, CELL*0.5+0.5);
    }
    ctx.fillStyle=p.l; rr(x+2.6,y+2.6,CELL*0.32,CELL*0.32,2); ctx.fill();
  }
}
function drawBoard(p,x0){
  ctx.fillStyle='#0c1226'; ctx.fillRect(x0,BY,BW,BH);
  ctx.strokeStyle='rgba(255,255,255,0.045)'; ctx.lineWidth=1;
  for(let c=1;c<COLS;c++){ ctx.beginPath(); ctx.moveTo(x0+c*CELL,BY); ctx.lineTo(x0+c*CELL,BY+BH); ctx.stroke(); }
  for(let r=1;r<ROWS;r++){ ctx.beginPath(); ctx.moveTo(x0,BY+r*CELL); ctx.lineTo(x0+BW,BY+r*CELL); ctx.stroke(); }

  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const cell=p.grid[I(r,c)];
    if(cell) drawCell(x0+c*CELL, BY+r*CELL, cell);
  }
  // outline tam, kde kousky zmizely (vidět delší dobu)
  for(const f of p.flashes){
    const x=x0+f.c*CELL, y=BY+f.r*CELL;
    ctx.strokeStyle='rgba(255,255,255,0.92)'; ctx.lineWidth=1.5;
    rr(x+1.6,y+1.6,CELL-3.2,CELL-3.2,3); ctx.stroke();
  }
  if(p.pill){
    for(const cl of cellsOf(p.pill)){
      if(cl.r>=0) drawCell(x0+cl.c*CELL, BY+cl.r*CELL, {color:cl.color,kind:'pill',partner:cl.partner});
    }
  }
  // glass frame
  ctx.strokeStyle='rgba(200,224,255,0.75)'; ctx.lineWidth=2;
  rr(x0-2.5,BY-1,BW+5,BH+3,3); ctx.stroke();
  ctx.fillStyle='rgba(200,224,255,0.5)'; ctx.fillRect(x0-5,BY-5,BW+10,3);
  ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.fillRect(x0+2,BY+2,3,BH-6);

  if(p.comboTimer>0){
    const a=Math.min(1,p.comboTimer/20);
    T('KOMBO ×'+p.comboN, x0+BW/2, BY+BH/2, 11, 'rgba(248,215,126,'+a+')','center',true);
  }
  if(p.pendingGarbage.length>0){
    T('⚠ '+p.pendingGarbage.length, x0+BW/2, BY-6, 8, '#ff9d5d', 'center', true);
  }
}

function drawCrown(cx, topY, s){

function frame(){
  frameCount++;
  pollGamepads();
  pollKeyboard();

// DAS pohyb do stran z herní smyčky (1× hned, krátká prodleva, pak rychlé opakování)
const keyHeld = {};
const kbRepeat = { a:{dir:0,timer:0}, b:{dir:0,timer:0} };
function dasMove(st, dir, player){
  if(dir===0){ st.dir=0; st.timer=0; return; }
  if(st.dir!==dir){ move(player,dir); st.dir=dir; st.timer=DAS_DELAY; }
  else if(--st.timer<=0){ move(player,dir); st.timer=DAS_RATE; }
}
function pollKeyboard(){
  if(mode!=='play' || paused || ending || performance.now()<countdownEnd) return;
  const p1=players[0], p2=players[1];
  const pa = p2.ai ? p1 : p2;            // šipky v sólo hře ovládají člověka
  dasMove(kbRepeat.a, (keyHeld['KeyD']?1:0)-(keyHeld['KeyA']?1:0), p1);
  dasMove(kbRepeat.b, (keyHeld['ArrowRight']?1:0)-(keyHeld['ArrowLeft']?1:0), pa);
}

window.addEventListener('keydown', e=>{
  keyHeld[e.code]=true;
  if(e.code==='KeyF'){ toggleFull(); e.preventDefault(); return; }

  if(mode==='menu'){
    if(e.code==='KeyW'||e.code==='ArrowUp') pendingAI=false;
    else if(e.code==='KeyS'||e.code==='ArrowDown') pendingAI=true;
    else if(e.code==='KeyA'||e.code==='ArrowLeft') level=Math.max(1,level-1);
    else if(e.code==='KeyD'||e.code==='ArrowRight') level=Math.min(5,level+1);
    else if(e.code==='Enter'||e.code==='NumpadEnter'||e.code==='Space') startGame(pendingAI);
    return;
  }
  if(mode==='over'){
    if(e.code==='Enter'||e.code==='NumpadEnter'||e.code==='Space') mode='menu';
    return;
  }
  // play
  if(ending) return;
  if(e.code==='KeyP'){ paused=!paused; return; }
  if(paused) return;
  const p1=players[0], p2=players[1];
  const pa = p2.ai ? p1 : p2;   // šipky: v sólo hře ovládají člověka (p1)
  switch(e.code){              // pohyb do stran řeší pollKeyboard (DAS)
    case 'KeyW': if(!e.repeat) rotate(p1); break;
    case 'KeyS': p1.softDrop=true; break;
    case 'ArrowUp':    if(!e.repeat) rotate(pa); e.preventDefault(); break;
    case 'ArrowDown':  pa.softDrop=true; e.preventDefault(); break;
    case 'ArrowLeft': case 'ArrowRight': e.preventDefault(); break;
  }
});
window.addEventListener('keyup', e=>{
  keyHeld[e.code]=false;
  if(mode!=='play') return;
  if(e.code==='KeyS') players[0].softDrop=false;
  if(e.code==='ArrowDown') (players[1].ai?players[0]:players[1]).softDrop=false;
});

//================= USB OVLADAČE (Gamepad API) =================
// Ovladač 0 -> Ženich, ovladač 1 -> Nevěsta. Klávesy WASD/šipky fungují dál.
const padPrev = {};      // index -> minulý stav (pro detekci stisku)
const padRepeat = {};    // index -> {dir,timer} pro plynulé držení doleva/doprava
function readPad(gp){
  const b = i => gp.buttons[i] && gp.buttons[i].pressed;
  const ax = gp.axes || [];
  const lx = ax[0]||0, ly = ax[1]||0;
  const up=b(12)||ly<-0.5, down=b(13)||ly>0.5, left=b(14)||lx<-0.5, right=b(15)||lx>0.5;
  return {
    up, down, left, right,
    rotate:  b(0)||b(1)||b(2)||b(3)||up,   // jakékoli tlačítko nebo nahoru = otočit
    confirm: b(0)||b(9),                    // A nebo Start
    start:   b(9),                          // Start = pauza
  };
}
function pollGamepads(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for(let i=0;i<pads.length;i++){
    const gp = pads[i]; if(!gp) continue;
    const cur = readPad(gp), prev = padPrev[i] || {};
    const hit = k => cur[k] && !prev[k];

    if(mode==='menu'){
      if(hit('up')) pendingAI = false; else if(hit('down')) pendingAI = true;
      if(hit('left')) level = Math.max(1,level-1); else if(hit('right')) level = Math.min(5,level+1);
      if(hit('confirm')) startGame(pendingAI);
    } else if(mode==='over'){
      if(hit('confirm')) mode='menu';
    } else if(mode==='play' && !ending){
      if(hit('start')) paused=!paused;
      let p = players[i];
      if(p && p.ai) p = players.find(x=>!x.ai);   // sólo: libovolný ovladač ovládá člověka
      if(!paused && p && !p.ai){
        if(hit('rotate')) rotate(p);
        p.softDrop = cur.down;
        const dir = cur.left ? -1 : cur.right ? 1 : 0;
        const rep = padRepeat[i] || {dir:0,timer:0};
        if(dir!==0){
          if(rep.dir!==dir){ move(p,dir); rep.dir=dir; rep.timer=DAS_DELAY; }   // 1× hned + prodleva
          else if(--rep.timer<=0){ move(p,dir); rep.timer=DAS_RATE; }           // rychlé opakování
        } else { rep.dir=0; rep.timer=0; }
        padRepeat[i] = rep;
      }
    }
    padPrev[i] = cur;
  }
}
window.addEventListener('gamepadconnected', ()=>{});

//================= FULLSCREEN =================
function toggleFull(){
  const tv=document.getElementById('tv');
  if(!document.fullscreenElement){
    (tv.requestFullscreen||tv.webkitRequestFullscreen).call(tv);
  } else {
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  }
}
document.getElementById('btnFull').addEventListener('click', toggleFull);
document.getElementById('btnStart').addEventListener('click', ()=>{
  if(mode==='menu') startGame(pendingAI); else mode='menu';
});
document.getElementById('btnStats').addEventListener('click', ()=>{
  const u=new URL(location.href); u.searchParams.set('stats',''); location.href=u.href;
});

//================= STATISTIKY (localStorage) =================
// localStorage funguje spolehlivě i přes file:// (na rozdíl od IndexedDB).
// Záznamy jsou drobné, takže limit ~5 MB stačí na desítky tisíc her.
const STORE_KEY='drwedding-games';
function loadGames(){
  try{ const v=JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); return Array.isArray(v)?v:[]; }
  catch(e){ console.warn('Statistiky se nepodařilo načíst:',e); return []; }
}
function saveGame(rec){
  try{
    const all=loadGames();
    all.push(rec);
    localStorage.setItem(STORE_KEY, JSON.stringify(all));
  }catch(e){ console.warn('Statistiku se nepodařilo uložit:',e); }
}

//================= STRÁNKA STATISTIK =================
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDur(ms){ const s=Math.round(ms/1000), m=(s/60)|0; return m>0 ? m+' m '+(s%60)+' s' : s+' s'; }
function fmtTime(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDayLabel(k){
  const [y,m,d]=k.split('-').map(Number);
  const date=new Date(y,m-1,d);
  return date.toLocaleDateString('cs-CZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

function renderStatsPage(){
  document.body.classList.add('statspage');
  const el=document.getElementById('stats');
  const backLink='<div class="back"><a href="'+esc(location.pathname)+'">← Zpět do hry</a></div>';

  const games=loadGames();
  games.sort((a,b)=> b.startedAt-a.startedAt);   // nejnovější první

  if(games.length===0){
    el.innerHTML='<h1>DR. WEDDING<small>STATISTIKY</small></h1>'
      +'<p class="empty">Zatím žádné dohrané hry.<br>Zahraj si a vrať se sem. 💍</p>'+backLink;
    return;
  }

  // seskupení po dnech (sestupně, protože hry jsou seřazené sestupně)
  const order=[]; const groups=new Map();
  for(const g of games){ const k=dayKey(g.startedAt); if(!groups.has(k)){ groups.set(k,[]); order.push(k); } groups.get(k).push(g); }

  let page=0;   // 0 = nejnovější den
  function render(){
    const key=order[page], rows=groups.get(key);
    let wL=0,wR=0,ai=0,total=0;
    for(const g of rows){ if(g.winner==='L') wL++; else wR++; if(g.vsAI) ai++; total+=g.durationMs; }

    const head='<h1>DR. WEDDING<small>STATISTIKY</small></h1>'
      +'<div class="nav">'
      +'<button id="sNewer"'+(page<=0?' disabled':'')+'>‹ Novější</button>'
      +'<span class="day">'+esc(fmtDayLabel(key))+'</span>'
      +'<button id="sOlder"'+(page>=order.length-1?' disabled':'')+'>Starší ›</button>'
      +'</div>'
      +'<div class="pageno">den '+(page+1)+' / '+order.length+'</div>'
      +'<div class="sum">'+rows.length+' '+plural(rows.length,'hra','hry','her')
      +' · ženich <b>'+wL+'×</b> · nevěsta <b>'+wR+'×</b>'
      +' · vs počítač <b>'+ai+'×</b> · celkem odehráno <b>'+fmtDur(total)+'</b></div>';

    let table='<table><thead><tr>'
      +'<th>Začátek</th><th>Trvání</th><th>Starosti</th><th>Režim</th><th>Vítěz</th>'
      +'</tr></thead><tbody>';
    for(const g of rows){
      const win = g.winner==='L'
        ? '<span class="win-L">Ženich</span>' : '<span class="win-R">Nevěsta</span>';
      table+='<tr>'
        +'<td>'+fmtTime(g.startedAt)+'</td>'
        +'<td>'+fmtDur(g.durationMs)+'</td>'
        +'<td class="num">'+g.viruses+' (úroveň '+g.level+')</td>'
        +'<td>'+(g.vsAI?'vs počítač':'dva hráči')+'</td>'
        +'<td>'+win+'</td>'
        +'</tr>';
    }
    table+='</tbody></table>';

    el.innerHTML=head+table+backLink;
    const older=document.getElementById('sOlder'), newer=document.getElementById('sNewer');
    if(older) older.onclick=()=>{ if(page<order.length-1){ page++; render(); window.scrollTo(0,0); } };
    if(newer) newer.onclick=()=>{ if(page>0){ page--; render(); window.scrollTo(0,0); } };
  }
  render();
}
function plural(n,one,few,many){ return n===1?one : (n>=2&&n<=4)?few : many; }

if(STATS_MODE) renderStatsPage();
</script>
