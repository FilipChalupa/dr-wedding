name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Povol jen jeden běžící deploy, nové pushe zruší ten předchozí
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Poskládej jen soubory webu (bez .git, .github, README apod.)
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html stats.html sounds.html audio.js sw.js \
             manifest.webmanifest icon.svg CNAME _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
